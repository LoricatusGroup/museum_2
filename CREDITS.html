<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Museum Credits</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 2rem; }
    .exhibit { margin-bottom: 2rem; padding: 1rem; background: #222; border-radius: 8px; }
    h2 { margin-top: 0; color: #4af; }
    a { color: #f4a; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Exhibit Credits</h1>

  <div class="exhibit">
    <h2>Test Exhibit</h2>
    <p><strong>Author:</strong> John Doe</p>
    <p><strong>License:</strong> CC-BY</p>
    <p><strong>Source:</strong> <a href="https://example.com" target="_blank">Link</a></p>
  </div>
  
  <div class="exhibit">
    <h2>Cool Statue</h2>
    <p><strong>Author:</strong> Jane Smith</p>
    <p><strong>License:</strong> CC0</p>
    <p><strong>Source:</strong> <a href="https://example.com/2" target="_blank">Link</a></p>
  </div>
  
</body>
</html>
