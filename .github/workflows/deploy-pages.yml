# Egyszerű munkafolyamat statikus tartalom GitHub Pages-re történő publikálásához
name: Deploy static content to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate index.html (ne deployoljunk törött JS-t)
        run: |
          node -e '
          const fs=require("fs");
          const h=fs.readFileSync("index.html","utf8");
          const blocks=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
          if(!blocks.length){console.error("Nincs inline script az index.html-ben!");process.exit(1);}
          const body=blocks.sort((a,b)=>b.length-a.length)[0];
          try{ new Function(body); }catch(e){ console.error("Szintaxis hiba az index.html inline scriptjében:", e.message); process.exit(1); }
          console.log("index.html inline script szintaxis OK");
          '
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prune non-public files
        # A belső/üzleti anyagok és fejlesztői fájlok NE kerüljenek ki a nyilvános oldalra.
        # Csak a CI-checkoutból töröljük; a repóban megmaradnak.
        run: |
          rm -rf felmeres_urlap FELMERESI_CHECKLIST.md \
                 tools uploads .github \
                 package.json package-lock.json .gitignore \
                 errors.log log.txt test_camera.js upgrade.py \
                 museum.html museum_backup.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # A gyökérmappa feltöltése (a fenti prune után)
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
