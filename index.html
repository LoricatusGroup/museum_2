<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Art Múzeum</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none
    }

    html,
    body {
      overflow: hidden;
      background: #f5f0e8;
      font-family: 'VT323', monospace;
      touch-action: none;
      width: 100%;
      height: 100%
    }

    canvas#c {
      display: block;
      width: 100%;
      height: 100%
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, .55), rgba(0, 0, 0, .92));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity .8s
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none
    }

    #overlay h1 {
      font-family: 'Press Start 2P', cursive;
      color: #f0e6d3;
      font-size: clamp(16px, 5vw, 28px);
      text-align: center;
      line-height: 1.8;
      text-shadow: 0 0 20px rgba(255, 200, 100, .5), 3px 3px 0 #2a1a0a;
      margin-bottom: 16px;
      animation: glow 2s ease-in-out infinite alternate
    }

    .subtitle {
      color: #c8a87a;
      font-size: clamp(14px, 3vw, 22px);
      margin-bottom: 24px;
      letter-spacing: 3px;
      text-align: center
    }

    .start-btn {
      font-family: 'Press Start 2P', cursive;
      color: #f0e6d3;
      font-size: clamp(10px, 2.5vw, 14px);
      padding: 14px 36px;
      border: 3px solid #c8a87a;
      background: rgba(42, 26, 10, .8);
      cursor: pointer;
      animation: pulse 1.5s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent
    }

    .start-btn:hover,
    .start-btn:active {
      background: rgba(200, 168, 122, .3);
      box-shadow: 0 0 30px rgba(200, 168, 122, .4)
    }

    .controls-info {
      color: #8a7a6a;
      font-size: clamp(13px, 2.2vw, 18px);
      margin-top: 20px;
      text-align: center;
      line-height: 1.8
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 20px rgba(255, 200, 100, .3), 3px 3px 0 #2a1a0a
      }

      to {
        text-shadow: 0 0 40px rgba(255, 200, 100, .7), 3px 3px 0 #2a1a0a
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .6
      }
    }

    #info-panel {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 252, 245, .95);
      border: 2px solid #aa9060;
      padding: 10px 20px;
      color: #2a2018;
      font-size: 18px;
      text-align: center;
      z-index: 50;
      opacity: 0;
      transition: opacity .4s;
      pointer-events: none;
      max-width: 88vw;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
      border-radius: 4px
    }

    #info-panel.visible {
      opacity: 1
    }

    #info-panel .t {
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(7px, 1.8vw, 10px);
      color: #8a6a22;
      margin-bottom: 4px;
      line-height: 1.5
    }

    #info-panel .a {
      color: #5a4a30;
      font-size: 16px
    }

    #info-panel .y {
      color: #8a7a6a;
      font-size: 14px
    }

    #wing-label {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 252, 245, .9);
      border: 1px solid #aa9060;
      padding: 6px 16px;
      color: #6a5a30;
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(7px, 1.5vw, 9px);
      z-index: 50;
      opacity: 0;
      transition: opacity .4s;
      pointer-events: none;
      border-radius: 3px;
      letter-spacing: 1px
    }

    #wing-label.visible {
      opacity: 1
    }

    #vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
      display: none;
      background: radial-gradient(ellipse at center, transparent 70%, rgba(0, 0, 0, .12) 100%)
    }

    #touch-ui {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 60;
      pointer-events: none
    }

    #joy-area {
      position: absolute;
      left: 14px;
      bottom: 14px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent
    }

    #joy-bg {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(100, 80, 50, .1);
      border: 2px solid rgba(100, 80, 50, .25)
    }

    #joy-knob {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(100, 80, 50, .25);
      border: 2px solid rgba(100, 80, 50, .4);
      top: 35px;
      left: 35px
    }

    #look-area {
      position: absolute;
      right: 0;
      top: 0;
      width: 60%;
      height: 100%;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent
    }

    #minimap {
      position: fixed;
      top: 8px;
      right: 8px;
      width: 70px;
      height: 70px;
      background: rgba(245, 240, 232, .92);
      border: 1px solid #aa9060;
      z-index: 50;
      display: none;
      border-radius: 3px
    }

    @media(min-width:768px) {
      #minimap {
        width: 80px;
        height: 80px
      }

      #info-panel {
        bottom: 30px
      }
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 45;
      display: none
    }

    #crosshair.active {
      border-color: #ffcc00;
      box-shadow: 0 0 8px #ffcc00
    }

    #art-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 5, 0, 0.92);
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none
    }

    #art-viewer.show {
      opacity: 1;
      pointer-events: auto;
      backdrop-filter: blur(8px)
    }

    #art-canvas-container {
      position: relative;
      width: 90%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center
    }

    #art-canvas-zoom {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 0 6px #886622, 0 0 0 10px #1a1005;
      max-width: 100%;
      border-radius: 3px;
      transform: scale(0.9);
      transition: transform 0.5s;
      object-fit: contain;
      background: #fff;
    }

    #art-viewer.show #art-canvas-zoom {
      transform: scale(1)
    }

    #art-title {
      color: #f0e6d3;
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(10px, 2vw, 18px);
      margin-top: 20px;
      text-align: center;
      text-shadow: 2px 2px 0 #000;
      line-height: 1.5
    }

    #art-desc {
      color: #aa9060;
      font-family: 'VT323', monospace;
      font-size: clamp(16px, 3vw, 24px);
      margin-top: 10px;
      text-align: center
    }

    #art-desc p {
      max-width: 600px;
      margin-top: 10px;
      color: #c0b0a0;
      font-size: clamp(14px, 2.5vw, 20px);
      line-height: 1.4
    }

    #art-close {
      position: absolute;
      top: 15px;
      right: 25px;
      color: #c8a87a;
      font-family: 'VT323', monospace;
      font-size: 35px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      line-height: 35px;
      text-align: center;
      background: rgba(20, 15, 10, 0.8);
      border-radius: 50%;
      border: 2px solid #a88833;
      transition: all 0.2s
    }

    #art-close:hover {
      background: #c8a87a;
      color: #111;
      transform: scale(1.1)
    }
  </style>
</head>

<body>
  <div id="overlay">
    <h1>PIXEL ART<br>MÚZEUM</h1>
    <div class="subtitle">─ 4 Szárny · PRÉMIUM KIADÁS ─</div>
    <div class="start-btn" id="startBtn">▶ BELÉPÉS</div>
    <div class="controls-info" id="hint"></div>
  </div>
  <div id="vignette"></div>

  <div id="crosshair"></div>
  <div id="art-viewer">
    <div id="art-close">X</div>
    <div id="art-canvas-container">
      <canvas id="art-canvas-zoom"></canvas>
      <div id="art-title"></div>
      <div id="art-desc"></div>
    </div>
  </div>

  <div id="wing-label" id="wL"></div>
  <div id="info-panel">
    <div class="t" id="iT"></div>
    <div class="a" id="iA"></div>
    <div class="y" id="iY"></div>
  </div>
  <canvas id="minimap"></canvas>
  <div id="touch-ui">
    <div id="joy-area">
      <div id="joy-bg">
        <div id="joy-knob"></div>
      </div>
    </div>
    <div id="look-area"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

        group.rotation.y = sp.ry;
        group.userData = { name: art.name, artist: art.artist, year: art.year };
        scene.add(group);
        artMeshes.push(group);

        // Plaque
        var plaque = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 0.03), plaqueMat);
        plaque.position.set(sp.x, 1.2, sp.z); plaque.rotation.y = sp.ry; scene.add(plaque);

        // Ropes
        var isVert = (Math.abs(sp.ry) === Math.PI / 2); // vertical wing (north) vs horizontal
        if (isVert) {
          var px = sp.x < 0 ? sp.x + 1.5 : sp.x - 1.5;
          for (var dz = -1.5; dz <= 1.5; dz += 3) {
            var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.9, 8), poleMat); pole.position.set(px, 0.45, sp.z + dz); scene.add(pole);
            var ball = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), poleMat); ball.position.set(px, 0.92, sp.z + dz); scene.add(ball);
          }
          var rope = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 3, 6), ropeMat); rope.rotation.x = Math.PI / 2; rope.position.set(px, 0.78, sp.z); scene.add(rope);
        } else {
          var pz = sp.z < 0 ? sp.z + 1.5 : sp.z - 1.5;
          for (var dx = -1.5; dx <= 1.5; dx += 3) {
            var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.9, 8), poleMat); pole.position.set(sp.x + dx, 0.45, pz); scene.add(pole);
            var ball = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), poleMat); ball.position.set(sp.x + dx, 0.92, pz); scene.add(ball);
          }
          var rope = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 3, 6), ropeMat); rope.rotation.z = Math.PI / 2; rope.position.set(sp.x, 0.78, pz); scene.add(rope);
        }
      }
    }

    function addLights() {
      scene.add(new THREE.AmbientLight(0xfff8f0, 0.95));

      // Hub lights
      for (var x = -5; x <= 5; x += 10)for (var z = -5; z <= 5; z += 10) {
        var l = new THREE.PointLight(0xffffff, 0.5, 15); l.position.set(x, 4.8, z); scene.add(l);
      }

      // North wing lights
      for (var z = -15; z >= -65; z -= 8) {
        var l = new THREE.PointLight(0xffffff, 0.5, 16); l.position.set(0, 4.8, z); scene.add(l);
        var l2 = new THREE.PointLight(0xfff8f0, 0.2, 10); l2.position.set(-5, 4.5, z); scene.add(l2);
        var l3 = new THREE.PointLight(0xfff8f0, 0.2, 10); l3.position.set(5, 4.5, z); scene.add(l3);
      }

      // East wing lights
      for (var x = 15; x <= 65; x += 8) {
        var l = new THREE.PointLight(0xffffff, 0.5, 16); l.position.set(x, 4.8, 0); scene.add(l);
        var l2 = new THREE.PointLight(0xfff8f0, 0.2, 10); l2.position.set(x, 4.5, -5); scene.add(l2);
        var l3 = new THREE.PointLight(0xfff8f0, 0.2, 10); l3.position.set(x, 4.5, 5); scene.add(l3);
      }

      // West wing lights
      for (var x = -15; x >= -65; x -= 8) {
        var l = new THREE.PointLight(0xffffff, 0.5, 16); l.position.set(x, 4.8, 0); scene.add(l);
        var l2 = new THREE.PointLight(0xfff8f0, 0.2, 10); l2.position.set(x, 4.5, -5); scene.add(l2);
        var l3 = new THREE.PointLight(0xfff8f0, 0.2, 10); l3.position.set(x, 4.5, 5); scene.add(l3);
      }


      // South wing lights
      for (var z = 15; z <= 65; z += 8) {
        var l = new THREE.PointLight(0xffffff, 0.5, 16); l.position.set(0, 4.8, z); scene.add(l);
        var l2 = new THREE.PointLight(0xfff8f0, 0.2, 10); l2.position.set(-5, 4.5, z); scene.add(l2);
        var l3 = new THREE.PointLight(0xfff8f0, 0.2, 10); l3.position.set(5, 4.5, z); scene.add(l3);
      }

      // Spotlights on artworks
      for (var i = 0; i < artMeshes.length; i++) {
        var a = artMeshes[i];
        var sl = new THREE.SpotLight(0xffffff, 1.8, 12, Math.PI / 5, 0.4, 1);
        // Position spotlight in front of painting
        var dir = new THREE.Vector3(0, 0, 1);
        dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), a.rotation.y);
        sl.position.set(a.position.x + dir.x * 3, 4.5, a.position.z + dir.z * 3);
        sl.target = a; sl.castShadow = true; scene.add(sl);
      }
    }

    // ── INPUT ──
    function setupInput() {
      document.addEventListener('keydown', function (e) {
        if (e.code === 'ArrowUp' || e.code === 'KeyW') mF = true;
        if (e.code === 'ArrowDown' || e.code === 'KeyS') mB = true;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') mL = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') mR = true;
      });
      document.addEventListener('keyup', function (e) {
        if (e.code === 'ArrowUp' || e.code === 'KeyW') mF = false;
        if (e.code === 'ArrowDown' || e.code === 'KeyS') mB = false;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') mL = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') mR = false;
      });
      if (mobile) setupTouch(); else setupMouse();
    }

    function setupMouse() {
      var cv = renderer.domElement; cv.style.cursor = 'grab';
      cv.addEventListener('mousedown', function (e) { dragging = true; dragX = e.clientX; dragY = e.clientY; cv.style.cursor = 'grabbing'; });
      addEventListener('mousemove', function (e) { if (!dragging) return; yaw -= (e.clientX - dragX) * .003; pitch -= (e.clientY - dragY) * .003; pitch = Math.max(-1, Math.min(1, pitch)); dragX = e.clientX; dragY = e.clientY; });
      addEventListener('mouseup', function () { dragging = false; renderer.domElement.style.cursor = 'grab'; });
    }

    function setupTouch() {
      document.getElementById('touch-ui').style.display = 'block';
      var jZ = document.getElementById('joy-area'), kn = document.getElementById('joy-knob'), lZ = document.getElementById('look-area');
      var jCx = 0, jCy = 0, lTid = null, lx = 0, ly = 0;
      function updK(cx, cy) { var dx = cx - jCx, dy = cy - jCy, d = Math.sqrt(dx * dx + dy * dy), mx = 35; if (d > mx) { dx = dx / d * mx; dy = dy / d * mx; } kn.style.left = (35 + dx) + 'px'; kn.style.top = (35 + dy) + 'px'; jVx = dx / mx; jVy = dy / mx; }
      jZ.addEventListener('touchstart', function (e) { e.preventDefault(); var t = e.changedTouches[0]; jTid = t.identifier; jActive = true; var r = jZ.getBoundingClientRect(); jCx = r.left + r.width / 2; jCy = r.top + r.height / 2; updK(t.clientX, t.clientY); }, { passive: false });
      jZ.addEventListener('touchmove', function (e) { e.preventDefault(); for (var i = 0; i < e.changedTouches.length; i++)if (e.changedTouches[i].identifier === jTid) updK(e.changedTouches[i].clientX, e.changedTouches[i].clientY); }, { passive: false });
      function endJ(e) { for (var i = 0; i < e.changedTouches.length; i++)if (e.changedTouches[i].identifier === jTid) { jActive = false; jTid = null; jVx = 0; jVy = 0; kn.style.left = '35px'; kn.style.top = '35px'; } }
      jZ.addEventListener('touchend', endJ, { passive: false }); jZ.addEventListener('touchcancel', endJ, { passive: false });
      lZ.addEventListener('touchstart', function (e) { e.preventDefault(); var t = e.changedTouches[0]; lTid = t.identifier; lx = t.clientX; ly = t.clientY; }, { passive: false });
      lZ.addEventListener('touchmove', function (e) { e.preventDefault(); for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; if (t.identifier === lTid) { yaw -= (t.clientX - lx) * .005; pitch -= (t.clientY - ly) * .005; pitch = Math.max(-1, Math.min(1, pitch)); lx = t.clientX; ly = t.clientY; } } }, { passive: false });
      function endL(e) { for (var i = 0; i < e.changedTouches.length; i++)if (e.changedTouches[i].identifier === lTid) lTid = null; }
      lZ.addEventListener('touchend', endL, { passive: false }); lZ.addEventListener('touchcancel', endL, { passive: false });
    }

    // ── GAME LOOP ──
    function loop() {
      requestAnimationFrame(loop);
      var dt = Math.min(clock.getDelta(), 0.05), speed = 6;
      camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));

      var dz = 0, dx = 0;
      if (mF) dz += 1; if (mB) dz -= 1; if (mR) dx += 1; if (mL) dx -= 1;
      if (jActive) { dx = jVx; dz = -jVy; }


      if (pts) {
        pts.rotation.y += 0.0005;
        var p = pts.geometry.attributes.position.array;
        for (var i = 1; i < p.length; i += 3) {
          p[i] -= 0.01; if (p[i] < -2.5) p[i] = 5;
        }
        pts.geometry.attributes.position.needsUpdate = true;
      }

      if (dx !== 0 || dz !== 0) {
        if (actx && actx.currentTime - lastStep > 0.45) { playStep(); lastStep = actx.currentTime; }
      }

      if (dx !== 0 || dz !== 0) {
        var fw = new THREE.Vector3(0, 0, -1); fw.applyQuaternion(camera.quaternion); fw.y = 0; fw.normalize();
        var st = new THREE.Vector3(1, 0, 0); st.applyQuaternion(camera.quaternion); st.y = 0; st.normalize();
        var nx = camera.position.x + (fw.x * dz + st.x * dx) * speed * dt;
        var nz = camera.position.z + (fw.z * dz + st.z * dx) * speed * dt;
        if (inBounds(nx, nz)) { camera.position.x = nx; camera.position.z = nz; }
        else if (inBounds(nx, camera.position.z)) { camera.position.x = nx; }
        else if (inBounds(camera.position.x, nz)) { camera.position.z = nz; }
      }
      camera.position.y = 2.5;

      // Info panel
      var panel = document.getElementById('info-panel');
      var closest = null, closestD = 999;
      for (var i = 0; i < artMeshes.length; i++) { var d = camera.position.distanceTo(artMeshes[i].position); if (d < closestD) { closestD = d; closest = artMeshes[i]; } }
      if (closest && closestD < 6) { panel.classList.add('visible'); document.getElementById('iT').textContent = closest.userData.name; document.getElementById('iA').textContent = closest.userData.artist; document.getElementById('iY').textContent = closest.userData.year; }
      else panel.classList.remove('visible');

      // Wing label
      var wl = document.getElementById('wing-label');
      wl.textContent = getWing(camera.position.x, camera.position.z);
      wl.classList.add('visible');

      // Minimap
      var mc = document.getElementById('minimap');
      if (mc.style.display !== 'none') {
        var w = mc.clientWidth, h = mc.clientHeight; mc.width = w; mc.height = h;
        var mx = mc.getContext('2d');
        mx.fillStyle = '#f0e8d8'; mx.fillRect(0, 0, w, h);
        var s = w / 160, ox = w / 2, oy = h / 2;
        mx.fillStyle = '#e0d8c8';
        // Draw wing shapes
        mx.fillRect(ox - 10 * s, oy - 70 * s, 20 * s, 60 * s); // North
        mx.fillRect(ox + 10 * s, oy - 10 * s, 60 * s, 20 * s); // East
        mx.fillRect(ox - 70 * s, oy - 10 * s, 60 * s, 20 * s); // West
        mx.fillRect(ox - 10 * s, oy - 10 * s, 20 * s, 20 * s); // Hub

        mx.fillRect(ox - 10 * s, oy + 10 * s, 20 * s, 60 * s); // South
        mx.strokeRect(ox - 10 * s, oy + 10 * s, 20 * s, 60 * s);

        mx.strokeStyle = '#aa9060'; mx.lineWidth = 1;
        mx.strokeRect(ox - 10 * s, oy - 70 * s, 20 * s, 60 * s);
        mx.strokeRect(ox + 10 * s, oy - 10 * s, 60 * s, 20 * s);
        mx.strokeRect(ox - 70 * s, oy - 10 * s, 60 * s, 20 * s);
        mx.strokeRect(ox - 10 * s, oy - 10 * s, 20 * s, 20 * s);
        // Paintings
        mx.fillStyle = '#cc8822';
        for (var i = 0; i < artMeshes.length; i++) { mx.fillRect(ox + artMeshes[i].position.x * s - 1, oy + artMeshes[i].position.z * s - 1, 2, 2); }
        // Player
        var px = ox + camera.position.x * s, pz = oy + camera.position.z * s;
        mx.fillStyle = '#dd3333'; mx.beginPath(); mx.arc(px, pz, 2.5, 0, Math.PI * 2); mx.fill();
        mx.strokeStyle = '#dd5555'; mx.lineWidth = 1; mx.beginPath(); mx.moveTo(px, pz);
        mx.lineTo(px + Math.sin(yaw) * -5, pz + Math.cos(yaw) * -5); mx.stroke();
      }

      renderer.render(scene, camera);
    }


    // ── AMBIENT & AUDIO ──
    var actx = null, pGain = null, ambOsc = null, ambGain = null;
    var lastStep = 0, stepFlip = false;
    function initAudio() {
      if (actx) return;
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      actx = new AudioContext();
      pGain = actx.createGain(); pGain.gain.value = 0.15; pGain.connect(actx.destination);

      // Ambient rumble
      var bufSize = actx.sampleRate * 2;
      var buf = actx.createBuffer(1, bufSize, actx.sampleRate);
      var out = buf.getChannelData(0);
      for (var i = 0; i < bufSize; i++) out[i] = Math.random() * 2 - 1;
      var noise = actx.createBufferSource();
      noise.buffer = buf; noise.loop = true;
      var filter = actx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = 400;
      ambGain = actx.createGain(); ambGain.gain.value = 0.05;
      noise.connect(filter); filter.connect(ambGain); ambGain.connect(actx.destination);
      noise.start(0);
    }

    function playStep() {
      if (!actx) return;
      var o = actx.createOscillator();
      var gn = actx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(stepFlip ? 200 : 240, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(40, actx.currentTime + 0.05);
      gn.gain.setValueAtTime(1, actx.currentTime);
      gn.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.08);
      o.connect(gn); gn.connect(pGain);
      o.start(); o.stop(actx.currentTime + 0.1);
      stepFlip = !stepFlip;
    }

    // ── SCULPTURES (VOXEL) ──
    function buildVoxelSculpture(x, z, ry, name, artist, year, voxels, hOff) {
      var grp = new THREE.Group();
      var mat = new THREE.MeshStandardMaterial({ color: 0xddeeee, roughness: 0.2, metalness: 0.1 });
      var vs = 0.15;
      for (var i = 0; i < voxels.length; i++) {
        for (var j = 0; j < voxels[i].length; j++) {
          var row = voxels[i][j];
          for (var k = 0; k < row.length; k++) {
            if (row[k]) {
              var m = new THREE.Mesh(new THREE.BoxGeometry(vs, vs, vs), mat);
              m.position.set(k * vs - row.length / 2 * vs, (voxels.length - i) * vs, j * vs - voxels[i].length / 2 * vs);
              m.castShadow = true; m.receiveShadow = true; grp.add(m);
            }
          }
        }
      }
      // Pedestal
      var pedMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a });
      var ped = new THREE.Mesh(new THREE.BoxGeometry(1.2, hOff, 1.2), pedMat);
      ped.position.y = -hOff / 2; grp.add(ped);

      grp.position.set(x, hOff, z);
      grp.rotation.y = ry;
      grp.userData = { name: name, artist: artist, year: year, isSculpture: true };

      var plaqueMat = new THREE.MeshStandardMaterial({ color: 0xccaa44, roughness: 0.3, metalness: 0.6 });
      var plaque = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.03), plaqueMat);
      plaque.position.set(x, hOff * 0.7, z + (ry === 0 ? 0.62 : -0.62));
      scene.add(plaque);

      var sl = new THREE.SpotLight(0xffffff, 2, 10, Math.PI / 6, 0.3, 1);
      sl.position.set(x, 5, z); sl.target = grp; sl.castShadow = true; scene.add(sl);

      scene.add(grp); artMeshes.push(grp);
    }

    // ── PARTICLES ──
    var pts;
    function addDust() {
      var geo = new THREE.BufferGeometry();
      var pos = new Float32Array(1500 * 3);
      for (var i = 0; i < 1500 * 3; i++) pos[i] = (Math.random() - 0.5) * 140;
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      var mat = new THREE.PointsMaterial({ color: 0xffeedd, size: 0.15, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false });
      pts = new THREE.Points(geo, mat);
      pts.position.y = 2.5; scene.add(pts);
    }

    function startMuseum() {
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('vignette').style.display = 'block';
      document.getElementById('crosshair').style.display = 'block';
      initAudio();
      document.getElementById('minimap').style.display = 'block';
    }
    document.getElementById('startBtn').addEventListener('click', startMuseum);
    document.getElementById('startBtn').addEventListener('touchend', function (e) { e.preventDefault(); startMuseum(); });

    var targetArt = null;
    var raycaster = new THREE.Raycaster();
    var pointer = new THREE.Vector2(0, 0);
    // Listener will be attached in setup
    document.getElementById('art-close').addEventListener('click', function () {
      document.getElementById('art-viewer').classList.remove('show');
    });
    function openArt(obj) {
      var ud = obj.userData;
      document.getElementById('art-title').innerHTML = ud.name + " <br><span style='font-size:0.6em;color:#da0'>" + ud.year + "</span>";
      document.getElementById('art-desc').innerHTML = "Festette: " + ud.artist + "<p>Ez a pixel art reprodukció tisztelgés a világ egyik legcsodálatosabb alkotása előtt.</p>";

      // Find painting data to redraw on big canvas
      var artData = paintings.find(function (p) { return p.name === ud.name; });
      if (artData) {
        var tmp = document.createElement('canvas'); tmp.width = artData.pw; tmp.height = artData.ph;
        artData.paint(tmp.getContext('2d'));
        var zc = document.getElementById('art-canvas-zoom');
        var maxW = Math.min(window.innerWidth * 0.8, 600);
        var sc = Math.floor(maxW / artData.pw);
        if (sc < 1) sc = 1;
        zc.width = artData.pw * sc; zc.height = artData.ph * sc;
        var zx = zc.getContext('2d');
        zx.imageSmoothingEnabled = false;
        zx.fillRect(0, 0, zc.width, zc.height);
        zx.drawImage(tmp, 0, 0, zc.width, zc.height);
      }
      document.getElementById('art-viewer').classList.add('show');
    }

    setup();

    renderer.domElement.addEventListener('click', function (e) {
      if (dragging && Math.abs(e.clientX - dragX) > 5) return;
      raycaster.setFromCamera(pointer, camera);
      var intersects = raycaster.intersectObjects(artMeshes, true);
      if (intersects.length > 0) {
        var obj = intersects[0].object;
        while (obj.parent && obj.parent.type === 'Group') obj = obj.parent;
        if (obj.userData.name && !obj.userData.isSculpture) {
          openArt(obj);
        }
      }
    });
  </script>
