<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Museum</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    #ui { position: absolute; bottom: 20px; left: 20px; color: white; pointer-events: none; text-shadow: 1px 1px 2px black; }
    #credits-link { position: absolute; top: 20px; left: 20px; color: #aaa; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; text-decoration: none; }
    #credits-link:hover { color: white; }
    #loading { position: absolute; top: 20px; right: 20px; color: #acf; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <a id="credits-link" href="CREDITS.html" target="_blank">View Credits</a>
  <div id="loading">Loading model...</div>
  <div id="ui">Controls:<br>Left Click + Drag: Orbit / Look around<br>Right Click + Drag: Pan<br>Scroll: Zoom<br><br>Move close to a pedestal to inspect.</div>
  <script type="module" src="app.js"></script>
</body>
</html>
