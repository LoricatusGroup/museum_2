<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Art Múzeum</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none
    }

    html,
    body {
      overflow: hidden;
      background: #f5f0e8;
      font-family: 'VT323', monospace;
      touch-action: none;
      width: 100%;
      height: 100%
    }

    canvas#c {
      display: block;
      width: 100%;
      height: 100%
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, .55), rgba(0, 0, 0, .92));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity .8s
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none
    }

    #overlay h1 {
      font-family: 'Press Start 2P', cursive;
      color: #f0e6d3;
      font-size: clamp(16px, 5vw, 28px);
      text-align: center;
      line-height: 1.8;
      text-shadow: 0 0 20px rgba(255, 200, 100, .5), 3px 3px 0 #2a1a0a;
      margin-bottom: 16px;
      animation: glow 2s ease-in-out infinite alternate
    }

    .subtitle {
      color: #c8a87a;
      font-size: clamp(14px, 3vw, 22px);
      margin-bottom: 24px;
      letter-spacing: 3px;
      text-align: center
    }

    .start-btn {
      font-family: 'Press Start 2P', cursive;
      color: #f0e6d3;
      font-size: clamp(10px, 2.5vw, 14px);
      padding: 14px 36px;
      border: 3px solid #c8a87a;
      background: rgba(42, 26, 10, .8);
      cursor: pointer;
      animation: pulse 1.5s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent
    }

    .start-btn:hover,
    .start-btn:active {
      background: rgba(200, 168, 122, .3);
      box-shadow: 0 0 30px rgba(200, 168, 122, .4)
    }

    .controls-info {
      color: #8a7a6a;
      font-size: clamp(13px, 2.2vw, 18px);
      margin-top: 20px;
      text-align: center;
      line-height: 1.8
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 20px rgba(255, 200, 100, .3), 3px 3px 0 #2a1a0a
      }

      to {
        text-shadow: 0 0 40px rgba(255, 200, 100, .7), 3px 3px 0 #2a1a0a
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .6
      }
    }

    #info-panel {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 252, 245, .95);
      border: 2px solid #aa9060;
      padding: 10px 20px;
      color: #2a2018;
      font-size: 18px;
      text-align: center;
      z-index: 50;
      opacity: 0;
      transition: opacity .4s;
      pointer-events: auto;
      max-width: 88vw;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
      border-radius: 4px
    }

    #info-panel.visible {
      opacity: 1
    }

    #fs-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, .5);
      color: #fff;
      border: 1px solid #aa9060;
      padding: 10px;
      cursor: pointer;
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      z-index: 100;
      display: none;
    }

    #mute-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, .5);
      color: #fff;
      border: 1px solid #aa9060;
      padding: 10px;
      cursor: pointer;
      font-size: 16px;
      z-index: 100;
      border-radius: 5px;
      display: none;
      line-height: 1;
    }

    #info-panel .t {
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(7px, 1.8vw, 10px);
      color: #8a6a22;
      margin-bottom: 4px;
      line-height: 1.5
    }

    #info-panel .a {
      color: #5a4a30;
      font-size: 16px
    }

    #info-panel .y {
      color: #8a7a6a;
      font-size: 14px
    }

    #wing-label {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 252, 245, .9);
      border: 1px solid #aa9060;
      padding: 6px 16px;
      color: #6a5a30;
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(7px, 1.5vw, 9px);
      z-index: 50;
      opacity: 0;
      transition: opacity .4s;
      pointer-events: none;
      border-radius: 3px;
      letter-spacing: 1px
    }

    #wing-label.visible {
      opacity: 1
    }

    #vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
      display: none;
      background: radial-gradient(ellipse at center, transparent 70%, rgba(0, 0, 0, .12) 100%)
    }

    #touch-ui {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 60;
      pointer-events: none
    }

    #joy-area {
      position: absolute;
      left: 16px;
      bottom: 16px;
      width: 140px;
      height: 140px;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      z-index: 2
    }

    #joy-bg {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(100, 80, 50, .15);
      border: 2px solid rgba(100, 80, 50, .3)
    }

    #joy-knob {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(100, 80, 50, .3);
      border: 2px solid rgba(100, 80, 50, .5);
      top: 42px;
      left: 42px
    }

    #look-area {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      z-index: 1
    }

    #minimap {
      position: fixed;
      top: 8px;
      right: 8px;
      width: 70px;
      height: 70px;
      background: rgba(245, 240, 232, .92);
      border: 1px solid #aa9060;
      z-index: 50;
      display: none;
      border-radius: 3px;
      pointer-events: none
    }

    @media(min-width:768px) {
      #minimap {
        width: 80px;
        height: 80px
      }

      #info-panel {
        bottom: 30px
      }
    }

    /* Mobile portrait optimizations */
    @media(max-width:767px) {
      #info-panel {
        bottom: auto;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 92vw;
        padding: 8px 14px;
        font-size: 16px;
        z-index: 70
      }

      #info-panel .t {
        font-size: clamp(7px, 2.5vw, 10px)
      }

      #info-panel .a {
        font-size: 14px
      }

      #info-panel .y {
        font-size: 13px
      }

      #wing-label {
        top: 6px;
        padding: 5px 12px;
        font-size: clamp(6px, 2vw, 9px);
        z-index: 65
      }

      #minimap {
        width: 60px;
        height: 60px;
        top: 6px;
        right: 6px;
        z-index: 65
      }

      #fs-btn {
        top: auto;
        bottom: 20px;
        left: auto;
        right: 10px;
        transform: none;
        font-size: 9px;
        padding: 7px 10px;
        opacity: 0.7
      }

      #mute-btn {
        top: 10px;
        left: 10px;
        right: auto;
        font-size: 16px;
        padding: 8px;
        opacity: 0.7;
      }

      #art-close {
        top: 10px;
        right: 10px;
        width: 48px;
        height: 48px;
        font-size: 40px;
        line-height: 42px
      }

      #mute-btn {
        top: 10px;
        right: 10px;
        padding: 8px;
        font-size: 14px;
      }

      #art-canvas-container {
        width: 95%;
        max-height: 70vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch
      }

      #art-title {
        font-size: clamp(8px, 3vw, 14px);
        margin-top: 12px;
        padding: 0 10px
      }

      #art-desc {
        font-size: clamp(14px, 3.5vw, 20px);
        padding: 0 10px
      }

      #art-desc p {
        font-size: clamp(13px, 3vw, 18px)
      }

      #sketchfab-viewer {
        height: 40vh;
        min-height: 220px
      }

      #art-viewer.show.sculpture-mode {
        padding-bottom: 30px
      }

      .controls-info {
        font-size: clamp(12px, 3vw, 16px);
        padding: 0 16px
      }
    }

    /* Mobile landscape optimizations */
    @media(max-height:500px) and (orientation:landscape) {
      #joy-area {
        left: 10px;
        bottom: 10px;
        width: 100px;
        height: 100px
      }

      #joy-bg {
        width: 100px;
        height: 100px
      }

      #joy-knob {
        width: 42px;
        height: 42px;
        top: 29px;
        left: 29px
      }

      #info-panel {
        bottom: auto;
        top: 6px;
        max-width: 50vw;
        padding: 6px 12px;
        font-size: 14px;
        z-index: 70
      }

      #wing-label {
        display: none
      }

      #minimap {
        width: 50px;
        height: 50px;
        top: 4px;
        right: 4px;
        z-index: 65
      }

      #art-canvas-container {
        width: 60%;
        max-height: 85vh
      }

      #art-close {
        top: 8px;
        right: 8px
      }

      #sketchfab-viewer {
        height: 70vh;
        min-height: 180px
      }
    }

    /* Safe area support for notched phones */
    @supports(padding: env(safe-area-inset-bottom)) {
      #joy-area {
        bottom: calc(16px + env(safe-area-inset-bottom));
        left: calc(16px + env(safe-area-inset-left))
      }

      #minimap {
        top: calc(8px + env(safe-area-inset-top));
        right: calc(8px + env(safe-area-inset-right))
      }

      #wing-label {
        top: calc(8px + env(safe-area-inset-top))
      }

      #art-close {
        top: calc(15px + env(safe-area-inset-top));
        right: calc(25px + env(safe-area-inset-right))
      }
    }

    @supports(padding: env(safe-area-inset-bottom)) {
      @media(max-width:767px) {
        #fs-btn {
          bottom: calc(20px + env(safe-area-inset-bottom));
          right: calc(10px + env(safe-area-inset-right))
        }

        #mute-btn {
          top: calc(10px + env(safe-area-inset-top));
          right: calc(10px + env(safe-area-inset-right))
        }
      }

      @media(min-width:768px) {
        #fs-btn {
          top: calc(10px + env(safe-area-inset-top));
          left: calc(10px + env(safe-area-inset-left))
        }

        #mute-btn {
          top: calc(10px + env(safe-area-inset-top));
          right: calc(10px + env(safe-area-inset-right))
        }
      }
    }

    top: calc(10px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left))
    }
    }
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 45;
      display: none
    }

    #crosshair.active {
      border-color: #ffcc00;
      box-shadow: 0 0 8px #ffcc00
    }

    #art-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 5, 0, 0.92);
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none
    }

    #art-viewer.show {
      opacity: 1;
      pointer-events: auto;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    #art-viewer.show.sculpture-mode {
      background: linear-gradient(to top, rgba(10, 5, 0, 0.9) 0%, rgba(10, 5, 0, 0) 40%);
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      justify-content: flex-end;
      padding-bottom: 50px;
    }

    #art-canvas-container {
      position: relative;
      width: 90%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center
    }

    #art-canvas-zoom {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 0 6px #886622, 0 0 0 10px #1a1005;
      max-width: 100%;
      border-radius: 3px;
      transform: scale(0.9);
      transition: transform 0.5s;
      object-fit: contain;
      background: #fff;
    }

    #sketchfab-viewer {
      width: 100%;
      height: 50vh;
      min-height: 300px;
      max-height: 600px;
      border: 0;
      border-radius: 6px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 0 4px #444;
      display: none;
      transform: scale(0.9);
      transition: transform 0.5s;
    }

    #art-viewer.show #art-canvas-zoom,
    #art-viewer.show #sketchfab-viewer {
      transform: scale(1)
    }

    #art-title {
      color: #f0e6d3;
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(10px, 2vw, 18px);
      margin-top: 20px;
      text-align: center;
      text-shadow: 2px 2px 0 #000;
      line-height: 1.5
    }

    #art-desc {
      color: #aa9060;
      font-family: 'VT323', monospace;
      font-size: clamp(16px, 3vw, 24px);
      margin-top: 10px;
      text-align: center
    }

    #art-desc p {
      max-width: 600px;
      margin-top: 10px;
      color: #c0b0a0;
      font-size: clamp(14px, 2.5vw, 20px);
      line-height: 1.4
    }

    #art-close {
      position: absolute;
      top: 15px;
      right: 25px;
      color: #c8a87a;
      font-family: 'VT323', monospace;
      font-size: 35px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      line-height: 35px;
      text-align: center;
      background: rgba(20, 15, 10, 0.8);
      border-radius: 50%;
      border: 2px solid #a88833;
      transition: all 0.2s
    }

    #art-close:hover {
      background: #c8a87a;
      color: #111;
      transform: scale(1.1)
    }
  </style>
</head>

    <h1>PIXEL ART<br>MÚZEUM</h1>
    <div class="subtitle">─ 4 Szárny · PRÉMIUM KIADÁS ─</div>
    <div class="start-btn" id="startBtn">▶ BELÉPÉS</div>
    <div class="controls-info" id="hint"></div>
  </div>
  <div id="vignette"></div>

  <div id="crosshair"></div>
  <div id="art-viewer">
    <div id="art-close">X</div>
    <div id="art-canvas-container">
      <canvas id="art-canvas-zoom"></canvas>
      <iframe id="sketchfab-viewer" allow="autoplay; fullscreen; xr-spatial-tracking" xr-spatial-tracking
        execution-while-out-of-viewport execution-while-not-rendered web-share src=""></iframe>
      <div id="art-title"></div>
      <div id="art-desc"></div>
    </div>
  </div>

  <div id="wing-label" id="wL"></div>
  <div id="fs-btn">🔲 TELJES KÉPERNYŐ</div>
  <div id="mute-btn" title="Hang ki/be">🔊</div>
  <div id="info-panel">
    <div class="t" id="iT"></div>
    <div class="a" id="iA"></div>
    <div class="y" id="iY"></div>
  </div>
  <canvas id="minimap"></canvas>
  <div id="touch-ui">
    <div id="joy-area">
      <div id="joy-bg">
        <div id="joy-knob"></div>
      </div>
    </div>
    <div id="look-area"></div>
  </div>

          F(11, 15, 3, 1, '#cc7766', c); F(12, 16, 2, 1, '#bb6655', c);
          F(13, 16, 3, 3, '#f8f8f0', c); F(14, 16, 2, 2, '#fff', c); F(14, 17, 1, 1, '#ffffee', c);

          F(2, 12, 4, 4, '#ddb88a', c); F(1, 10, 3, 6, '#ccaa78', c);

        var cx = cv.getContext('2d'); cx.imageSmoothingEnabled = false; cx.drawImage(tmp, 0, 0, cv.width, cv.height);
        var tex = new THREE.CanvasTexture(cv); tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;

        var aspect = art.pw / art.ph, aH = 2.2, aW = aH * aspect, fp = 0.15;

        // Frame
        var t = new THREE.Mesh(new THREE.BoxGeometry(aW + fp * 2, fp, 0.08), frameMat); t.position.y = aH / 2 + fp / 2; group.add(t);

        var l = new THREE.Mesh(new THREE.BoxGeometry(fp, aH + fp * 2, 0.08), frameMat); l.position.x = -aW / 2 - fp / 2; group.add(l);
        var r = new THREE.Mesh(new THREE.BoxGeometry(fp, aH + fp * 2, 0.08), frameMat); r.position.x = aW / 2 + fp / 2; group.add(r);

        // Ropes

        if (isVert) {

      // ── SKETCHFAB 3D MODELS (VITRINEK / GLB) ──
      var sfSpots = [];

        // Ha van glbUrl, megpróbáljuk betölteni a 3D fájlt, különben marad a drótváz!
        if (sf.glbUrl) {
          (function (group, url) {
            gltfLoader.load(url, function (gltf) {
              var model = gltf.scene;
              // Méretezés, hogy kb 1.5 egység magas legyen
              var box = new THREE.Box3().setFromObject(model);
              var size = box.getSize(new THREE.Vector3()).length();
              var scale = 1.8 / (size === 0 ? 1 : size);
              model.scale.setScalar(scale);
              box.setFromObject(model);
              var center = box.getCenter(new THREE.Vector3());
              model.position.sub(center); // Középre igazítás
              model.position.y += 0.5; // Kicsit feljebb a talapzaton
              group.add(model);
            });
          })(sfGrp, sf.glbUrl);
        } else {
          // Fallback holo wireframe, ha még nincs letöltve a fájl, vagy iframe mód van
          var sfHolo = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.1, 0.8), sfHoloMat);
          sfGrp.add(sfHolo);

        sfGrp.position.set(sp.x, hOff, sp.z);
        sfGrp.rotation.y = sp.ry;
        sfGrp.userData = sf;

        var sfPlaque = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.03), sfPlaqueMat);
        sfPlaque.position.set(sp.x, hOff * 0.7, sp.z + (sp.ry === 0 ? 0.62 : (sp.ry > 0 ? -0.62 : 0.62)));
        if (sp.ry !== 0) sfPlaque.position.set(sp.x + (sp.ry > 0 ? 0.62 : -0.62), hOff * 0.7, sp.z);

        if (e.code === 'ArrowLeft' || e.code === 'KeyA') mL = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') mR = true;
      });
      document.addEventListener('keyup', function (e) {
        if (e.code === 'ArrowUp' || e.code === 'KeyW') mF = false;
        if (e.code === 'ArrowDown' || e.code === 'KeyS') mB = false;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') mL = false;

      if (mobile) setupTouch(); else setupMouse();

    function setupMouse() {
      var cv = renderer.domElement; cv.style.cursor = 'grab';
      cv.addEventListener('mousedown', function (e) { dragging = true; dragX = e.clientX; dragY = e.clientY; cv.style.cursor = 'grabbing'; });
      addEventListener('mousemove', function (e) { if (!dragging) return; yaw -= (e.clientX - dragX) * .003; pitch -= (e.clientY - dragY) * .003; pitch = Math.max(-1, Math.min(1, pitch)); dragX = e.clientX; dragY = e.clientY; });
      addEventListener('mouseup', function () { dragging = false; renderer.domElement.style.cursor = 'grab'; });
    }

      var lookTap = false, lookX = 0, lookY = 0, lookTime = 0;
      updateJoystickLayout();
      function updK(cx, cy) { var dx = cx - jCx, dy = cy - jCy, d = Math.sqrt(dx * dx + dy * dy), mx = jMax; if (d > mx) { dx = dx / d * mx; dy = dy / d * mx; } jKnob.style.left = (knOff + dx) + 'px'; jKnob.style.top = (knOff + dy) + 'px'; jVx = dx / mx; jVy = dy / mx; }
      jZ.addEventListener('touchstart', function (e) { e.preventDefault(); var t = e.changedTouches[0]; jTid = t.identifier; jActive = true; var r = jZ.getBoundingClientRect(); jCx = r.left + r.width / 2; jCy = r.top + r.height / 2; updK(t.clientX, t.clientY); }, { passive: false });
      jZ.addEventListener('touchmove', function (e) { e.preventDefault(); for (var i = 0; i < e.changedTouches.length; i++)if (e.changedTouches[i].identifier === jTid) updK(e.changedTouches[i].clientX, e.changedTouches[i].clientY); }, { passive: false });
      function endJ(e) { for (var i = 0; i < e.changedTouches.length; i++)if (e.changedTouches[i].identifier === jTid) { jActive = false; jTid = null; jVx = 0; jVy = 0; jKnob.style.left = knOff + 'px'; jKnob.style.top = knOff + 'px'; } }
      jZ.addEventListener('touchend', endJ, { passive: false }); jZ.addEventListener('touchcancel', endJ, { passive: false });
      lZ.addEventListener('touchstart', function (e) { e.preventDefault(); var t = e.changedTouches[0]; lTid = t.identifier; lx = t.clientX; ly = t.clientY; lookTap = true; lookX = lx; lookY = ly; lookTime = Date.now(); }, { passive: false });
      lZ.addEventListener('touchmove', function (e) { e.preventDefault(); for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; if (t.identifier === lTid) { if (Math.abs(t.clientX - lookX) > 10 || Math.abs(t.clientY - lookY) > 10) lookTap = false; yaw -= (t.clientX - lx) * .005; pitch -= (t.clientY - ly) * .005; pitch = Math.max(-1, Math.min(1, pitch)); lx = t.clientX; ly = t.clientY; } } }, { passive: false });
      function endL(e) { for (var i = 0; i < e.changedTouches.length; i++)if (e.changedTouches[i].identifier === lTid) { lTid = null; if (lookTap && Date.now() - lookTime < 400 && typeof fireRaycast === 'function') fireRaycast(); } }
      lZ.addEventListener('touchend', endL, { passive: false }); lZ.addEventListener('touchcancel', endL, { passive: false });
    }

    // ── GAME LOOP ──
    function loop() {
      requestAnimationFrame(loop);
      var dt = Math.min(clock.getDelta(), 0.05), speed = 6;
      camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));

      var dz = 0, dx = 0;
      if (mF) dz += 1; if (mB) dz -= 1; if (mR) dx += 1; if (mL) dx -= 1;
      if (jActive) { dx = jVx; dz = -jVy; }


      if (pts) {
        pts.rotation.y += 0.0005;
        var p = pts.geometry.attributes.position.array;
        for (var i = 1; i < p.length; i += 3) {
          p[i] -= 0.01; if (p[i] < -2.5) p[i] = 5;
        }
        pts.geometry.attributes.position.needsUpdate = true;
      }

      if (isSitting && (dx !== 0 || dz !== 0)) {
        isSitting = false;
        camera.position.y = 2.5;
        document.getElementById('hint').textContent = "";
      }

      if (dx !== 0 || dz !== 0) {
        if (!isSitting && actx && actx.currentTime - lastStep > 0.45) { playStep(); lastStep = actx.currentTime; }
      }

      if ((dx !== 0 || dz !== 0) && !isSitting) {
        var fw = new THREE.Vector3(0, 0, -1); fw.applyQuaternion(camera.quaternion); fw.y = 0; fw.normalize();
        var st = new THREE.Vector3(1, 0, 0); st.applyQuaternion(camera.quaternion); st.y = 0; st.normalize();
        var nx = camera.position.x + (fw.x * dz + st.x * dx) * speed * dt;
        var nz = camera.position.z + (fw.z * dz + st.z * dx) * speed * dt;
        if (inBounds(nx, nz)) { camera.position.x = nx; camera.position.z = nz; }
        else if (inBounds(nx, camera.position.z)) { camera.position.x = nx; }
        else if (inBounds(camera.position.x, nz)) { camera.position.z = nz; }
      }
      if (!isSitting) camera.position.y = 2.5;

      // Info panel
      var panel = document.getElementById('info-panel');
      var closest = null, closestD = 999;
      for (var i = 0; i < artMeshes.length; i++) { var d = camera.position.distanceTo(artMeshes[i].position); if (d < closestD) { closestD = d; closest = artMeshes[i]; } }
      if (closest && closestD < 6) {
        panel.classList.add('visible');
        var uT = closest.userData.name;
        if (closest.userData.sourceLink) {
          document.getElementById('iT').innerHTML = "<a href='" + closest.userData.sourceLink + "' target='_blank' style='color:#aa9060; text-decoration:none;'>" + uT + "</a>";
        } else {
          document.getElementById('iT').textContent = uT;
        }
        document.getElementById('iA').textContent = closest.userData.artist;
        document.getElementById('iY').textContent = closest.userData.year;
      }
      else panel.classList.remove('visible');

      // Wing label
      var wl = document.getElementById('wing-label');
      wl.textContent = getWing(camera.position.x, camera.position.z);
      wl.classList.add('visible');

      // Minimap
      var mc = document.getElementById('minimap');
      if (mc.style.display !== 'none') {
        var w = mc.clientWidth, h = mc.clientHeight; mc.width = w; mc.height = h;
        var mx = mc.getContext('2d');
        mx.fillStyle = '#f0e8d8'; mx.fillRect(0, 0, w, h);
        var s = w / 160, ox = w / 2, oy = h / 2;
        mx.fillStyle = '#e0d8c8';
        // Draw wing shapes
        mx.fillRect(ox - 10 * s, oy - 70 * s, 20 * s, 60 * s); // North
        mx.fillRect(ox + 10 * s, oy - 10 * s, 60 * s, 20 * s); // East
        mx.fillRect(ox - 70 * s, oy - 10 * s, 60 * s, 20 * s); // West
        mx.fillRect(ox - 10 * s, oy - 10 * s, 20 * s, 20 * s); // Hub

        mx.fillRect(ox - 10 * s, oy + 10 * s, 20 * s, 60 * s); // South
        mx.strokeRect(ox - 10 * s, oy + 10 * s, 20 * s, 60 * s);

        mx.strokeStyle = '#aa9060'; mx.lineWidth = 1;
        mx.strokeRect(ox - 10 * s, oy - 70 * s, 20 * s, 60 * s);
        mx.strokeRect(ox + 10 * s, oy - 10 * s, 60 * s, 20 * s);
        mx.strokeRect(ox - 70 * s, oy - 10 * s, 60 * s, 20 * s);
        mx.strokeRect(ox - 10 * s, oy - 10 * s, 20 * s, 20 * s);
        // Paintings
        mx.fillStyle = '#cc8822';
        for (var i = 0; i < artMeshes.length; i++) { mx.fillRect(ox + artMeshes[i].position.x * s - 1, oy + artMeshes[i].position.z * s - 1, 2, 2); }
        // Player
        var px = ox + camera.position.x * s, pz = oy + camera.position.z * s;
        mx.fillStyle = '#dd3333'; mx.beginPath(); mx.arc(px, pz, 2.5, 0, Math.PI * 2); mx.fill();
        mx.strokeStyle = '#dd5555'; mx.lineWidth = 1; mx.beginPath(); mx.moveTo(px, pz);
        mx.lineTo(px + Math.sin(yaw) * -5, pz + Math.cos(yaw) * -5); mx.stroke();
      }

      renderer.render(scene, camera);
    }


    // ── AMBIENT & AUDIO ──
    var actx = null, pGain = null, ambOsc = null, ambGain = null;
    var lastStep = 0, stepFlip = false;
    var isMuted = false;
    function initAudio() {
      if (actx) return;
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      actx = new AudioContext();
      pGain = actx.createGain(); pGain.gain.value = 0.15; pGain.connect(actx.destination);

      // Ambient rumble
      var bufSize = actx.sampleRate * 2;
      var buf = actx.createBuffer(1, bufSize, actx.sampleRate);
      var out = buf.getChannelData(0);
      for (var i = 0; i < bufSize; i++) out[i] = Math.random() * 2 - 1;
      var noise = actx.createBufferSource();
      noise.buffer = buf; noise.loop = true;
      var filter = actx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = 400;
      ambGain = actx.createGain(); ambGain.gain.value = 0.05;
      noise.connect(filter); filter.connect(ambGain); ambGain.connect(actx.destination);
      noise.start(0);
    }

    function playStep() {
      if (!actx) return;
      var o = actx.createOscillator();
      var gn = actx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(stepFlip ? 200 : 240, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(40, actx.currentTime + 0.05);
      gn.gain.setValueAtTime(1, actx.currentTime);
      gn.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.08);
      o.connect(gn); gn.connect(pGain);
      o.start(); o.stop(actx.currentTime + 0.1);
      stepFlip = !stepFlip;
    }

    // ── SCULPTURES (VOXEL) ──
    function buildVoxelSculpture(x, z, ry, name, artist, year, stringLayers, hOff) {
      var voxels = stringLayers.map(function (layer) { return layer.map(function (row) { return row.split('').map(function (c) { return c === '1' ? 1 : 0; }); }); });
      var grp = new THREE.Group();
      var mat = new THREE.MeshStandardMaterial({ color: 0xddeeee, roughness: 0.2, metalness: 0.1 });
      var vs = 0.12; // Adjusted voxel size for higher resolution (12 layers = 1.44h)
      for (var i = 0; i < voxels.length; i++) {
        for (var j = 0; j < voxels[i].length; j++) {
          var row = voxels[i][j];
          for (var k = 0; k < row.length; k++) {
            if (row[k]) {
              var m = new THREE.Mesh(new THREE.BoxGeometry(vs, vs, vs), mat);
              m.position.set(k * vs - row.length / 2 * vs, (voxels.length - i) * vs, j * vs - voxels[i].length / 2 * vs);
              m.castShadow = true; m.receiveShadow = true; grp.add(m);
            }
          }
        }
      }
      // Pedestal
      var pedMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a });
      var ped = new THREE.Mesh(new THREE.BoxGeometry(1.2, hOff, 1.2), pedMat);
      ped.position.y = -hOff / 2; grp.add(ped);

      grp.position.set(x, hOff, z);
      grp.rotation.y = ry;
      grp.userData = { name: name, artist: artist, year: year, isSculpture: true };

      var plaqueMat = new THREE.MeshStandardMaterial({ color: 0xccaa44, roughness: 0.3, metalness: 0.6 });
      var plaque = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.03), plaqueMat);
      // Position plaque relative to the group so it rotates with the sculpture!
      plaque.position.set(0, -hOff * 0.3, 0.62);
      grp.add(plaque);

      if (!mobile) {
        var sl = new THREE.SpotLight(0xffffff, 2, 10, Math.PI / 6, 0.3, 1);
        sl.position.set(x, 5, z); sl.target = grp; sl.castShadow = true; scene.add(sl);
      }

      scene.add(grp); artMeshes.push(grp);
    }

    // ── PARTICLES ──
    var pts;
    function addDust() {
      var geo = new THREE.BufferGeometry();
      var dustCount = mobile ? 500 : 1500;
      var pos = new Float32Array(dustCount * 3);
      for (var i = 0; i < dustCount * 3; i++) pos[i] = (Math.random() - 0.5) * 140;
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      var mat = new THREE.PointsMaterial({ color: 0xffeedd, size: 0.15, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false });
      pts = new THREE.Points(geo, mat);
      pts.position.y = 2.5; scene.add(pts);
    }

    function startMuseum() {
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('vignette').style.display = 'block';
      document.getElementById('crosshair').style.display = 'block';
      document.getElementById('mute-btn').style.display = 'block';
      initAudio();
      document.getElementById('minimap').style.display = 'block';
      document.getElementById('fs-btn').style.display = 'block';
    }
    document.getElementById('startBtn').addEventListener('click', startMuseum);
    document.getElementById('startBtn').addEventListener('touchend', function (e) { e.preventDefault(); startMuseum(); });

    document.getElementById('fs-btn').addEventListener('click', function () {
      var elem = document.documentElement;
      if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        if (elem.requestFullscreen) { elem.requestFullscreen(); }
        else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
        else if (elem.mozRequestFullScreen) { elem.mozRequestFullScreen(); }
        else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT); }
      } else {
        if (document.exitFullscreen) { document.exitFullscreen(); }
        else if (document.msExitFullscreen) { document.msExitFullscreen(); }
        else if (document.mozCancelFullScreen) { document.mozCancelFullScreen(); }
        else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
      }
    });

    var targetArt = null;
    var raycaster = new THREE.Raycaster();
    var pointer = new THREE.Vector2(0, 0);
    // Listener will be attached in setup
    document.getElementById('art-close').addEventListener('click', function () {
      document.getElementById('art-viewer').classList.remove('show');
      document.getElementById('sketchfab-viewer').src = ""; // Állítsuk le a 3D modellt, ha bezárja
    });
    function openArt(obj) {
      var ud = obj.userData;

      var titleHtml = ud.sourceLink
        ? "<a href='" + ud.sourceLink + "' target='_blank' style='color:inherit;text-decoration:underline;'>" + ud.name + "</a> <br><span style='font-size:0.6em;color:#da0'>" + ud.year + "</span>"
        : ud.name + " <br><span style='font-size:0.6em;color:#da0'>" + ud.year + "</span>";

      document.getElementById('art-title').innerHTML = titleHtml;

      var zc = document.getElementById('art-canvas-zoom');
      activeSculpture = null;

      var viewer = document.getElementById('art-viewer');
      var sfViewer = document.getElementById('sketchfab-viewer');

      if (ud.glbUrl) {
        document.getElementById('art-desc').innerHTML = "Készítette: " + ud.artist + "<p>Ez a valós életből vett műtárgy 3D mása a Sketchfabról származik.</p><p style='font-size:0.7em;color:#aaa'>(Húzd az egeret vagy az ujjad a képernyőn a forgatáshoz)</p>";
        zc.style.display = 'none';
        sfViewer.style.display = 'none';
        sfViewer.src = "";
        activeSculpture = obj;
        viewer.classList.add('sculpture-mode');
      } else if (ud.sketchfabId) {
        document.getElementById('art-desc').innerHTML = "Készítette: " + ud.artist + "<br><span style='font-size:0.75em'>" + ud.year + "</span><p>Forgasd a 3D modellt az egérrel (vagy érintéssel)! A görgővel nagyíthatsz.</p>";
        zc.style.display = 'none';
        sfViewer.src = "https://sketchfab.com/models/" + ud.sketchfabId + "/embed?autostart=1&ui_theme=dark&ui_infos=0&ui_watermark=0&ui_annotations=0";
        sfViewer.style.display = 'block';
        viewer.classList.add('sculpture-mode'); // Use same transparent style
      } else if (ud.isSculpture) {
        document.getElementById('art-desc').innerHTML = "Készítette: " + ud.artist + "<p>Ez a voxel újraalkotás a klasszikus szobrászat előtt tiszteleg.</p><p style='font-size:0.7em;color:#aaa'>(Húzd az egeret vagy az ujjad az ablakon a forgatáshoz)</p>";
        zc.style.display = 'none';
        sfViewer.style.display = 'none';
        sfViewer.src = "";
        activeSculpture = obj;
        viewer.classList.add('sculpture-mode');
      } else {
        document.getElementById('art-desc').innerHTML = "Festette: " + ud.artist + "<p>Ez a pixel art reprodukció tisztelgés a világ egyik legcsodálatosabb alkotása előtt.</p>";
        zc.style.display = 'block';
        sfViewer.style.display = 'none';
        sfViewer.src = "";
        viewer.classList.remove('sculpture-mode');
        // Find painting data to redraw on big canvas
        var artData = paintings.find(function (p) { return p.name === ud.name; });
        if (artData) {
          var tmp = document.createElement('canvas'); tmp.width = artData.pw; tmp.height = artData.ph;
          artData.paint(tmp.getContext('2d'));
          var maxW = Math.min(window.innerWidth * (mobile ? 0.9 : 0.8), mobile ? 400 : 600);
          var maxH = window.innerHeight * (mobile ? 0.5 : 0.65);
          var sc = Math.floor(Math.min(maxW / artData.pw, maxH / artData.ph));
          if (sc < 1) sc = 1;
          zc.width = artData.pw * sc; zc.height = artData.ph * sc;
          var zx = zc.getContext('2d');
          zx.imageSmoothingEnabled = false;
          zx.fillRect(0, 0, zc.width, zc.height);
          zx.drawImage(tmp, 0, 0, zc.width, zc.height);
        }
      }
      viewer.classList.add('show');
    }

    // Megpróbáljuk betölteni az assets/exhibits.json-t, ha létezik, és utána setup()
    fetch('assets/exhibits.json')
      .then(function (res) { return res.ok ? res.json() : Promise.reject('No custom models file.'); })
      .then(function (data) {
        if (data && data.length > 0) {
          // Ha van generált adatunk, felülírjuk vele a beépített modellek listáját!
          sketchfabModels = data.map(function (d) {
            return { name: d.title, artist: d.author, year: "Sketchfab", glbUrl: d.modelUrl, sourceLink: d.sourceLink };
          });
        }
        setup();
      })
      .catch(function (e) {
        console.log("Using default Sketchfab models logic.", e);
        setup();
      });

    var viewer = document.getElementById('art-viewer');
    function startDrag(e) { if (!activeSculpture) return; viewerDragging = true; vDragX = (e.touches ? e.touches[0].clientX : e.clientX); }
    function onDrag(e) { if (viewerDragging && activeSculpture) { activeSculpture.rotation.y += ((e.touches ? e.touches[0].clientX : e.clientX) - vDragX) * 0.01; vDragX = (e.touches ? e.touches[0].clientX : e.clientX); } }
    function endDrag() { viewerDragging = false; }

    viewer.addEventListener('mousedown', startDrag);
    viewer.addEventListener('mousemove', onDrag);
    viewer.addEventListener('mouseup', endDrag);
    viewer.addEventListener('mouseleave', endDrag);
    viewer.addEventListener('touchstart', startDrag);
    viewer.addEventListener('touchmove', onDrag);
    viewer.addEventListener('touchend', endDrag);

    function fireRaycast() {
      raycaster.setFromCamera(pointer, camera);
      var intersects = raycaster.intersectObjects(artMeshes, true);
      if (intersects.length > 0) {
        var obj = intersects[0].object;
        while (obj.parent && (obj.userData.isBench === undefined && obj.userData.name === undefined)) {
          obj = obj.parent;
          if (obj === scene) break;
        }

        if (obj.userData.isBench) {
          if (isSitting) return;
          var pos = new THREE.Vector3();
          obj.getWorldPosition(pos);
          camera.position.set(pos.x, pos.y + 0.8, pos.z);
          isSitting = true;
          document.getElementById('hint').textContent = "[ Nyomj meg egy mozgás gombot a felálláshoz ]";
          return;
        }

        if (obj.userData.name) {
          openArt(obj);
        }
      }
    }

    renderer.domElement.addEventListener('click', function (e) {
      if (dragging && Math.abs(e.clientX - dragX) > 5) return;
      fireRaycast();
    });
  </script>
