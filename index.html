    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none

    html,
    body {
      overflow: hidden;
      background: #f5f0e8;
      font-family: 'VT323', monospace;
      touch-action: none;
      width: 100%;
      height: 100%

    canvas#c {
      display: block;
      width: 100%;
      height: 100%
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, .55), rgba(0, 0, 0, .92));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity .8s
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none
    }

    #overlay h1 {
      font-family: 'Press Start 2P', cursive;
      color: #f0e6d3;
      font-size: clamp(16px, 5vw, 28px);
      text-align: center;
      line-height: 1.8;
      text-shadow: 0 0 20px rgba(255, 200, 100, .5), 3px 3px 0 #2a1a0a;
      margin-bottom: 16px;
      animation: glow 2s ease-in-out infinite alternate
    }

    .subtitle {
      color: #c8a87a;
      font-size: clamp(14px, 3vw, 22px);
      margin-bottom: 24px;
      letter-spacing: 3px;
      text-align: center
    }

    .start-btn {
      font-family: 'Press Start 2P', cursive;
      color: #f0e6d3;
      font-size: clamp(10px, 2.5vw, 14px);
      padding: 14px 36px;
      border: 3px solid #c8a87a;
      background: rgba(42, 26, 10, .8);
      cursor: pointer;
      animation: pulse 1.5s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent
    }

    .start-btn:hover,
    .start-btn:active {
      background: rgba(200, 168, 122, .3);
      box-shadow: 0 0 30px rgba(200, 168, 122, .4)
    }

    .controls-info {
      color: #8a7a6a;
      font-size: clamp(13px, 2.2vw, 18px);
      margin-top: 20px;
      text-align: center;
      line-height: 1.8
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 20px rgba(255, 200, 100, .3), 3px 3px 0 #2a1a0a
      }

      to {
        text-shadow: 0 0 40px rgba(255, 200, 100, .7), 3px 3px 0 #2a1a0a
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .6
      }
    }

    #info-panel {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 252, 245, .95);
      border: 2px solid #aa9060;
      padding: 10px 20px;
      color: #2a2018;
      font-size: 18px;
      text-align: center;
      z-index: 50;
      opacity: 0;
      transition: opacity .4s;
      pointer-events: auto;
      max-width: 88vw;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
      border-radius: 4px
    }

    #info-panel.visible {
      opacity: 1
    }

    #fs-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, .5);
      color: #fff;
      border: 1px solid #aa9060;
      padding: 10px;
      cursor: pointer;
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      z-index: 100;
      display: none;
    }

    #mute-btn {
      position: fixed;
      top: 10px;
      right: 81px;
      background: rgba(0, 0, 0, .5);
      color: #fff;
      border: 1px solid #aa9060;
      padding: 10px;
      cursor: pointer;
      font-size: 16px;
      z-index: 100;
      border-radius: 5px;
      display: none;
      line-height: 1;
    }

    #info-panel .t {
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(7px, 1.8vw, 10px);
      color: #8a6a22;
      margin-bottom: 4px;
      line-height: 1.5
    }

    #info-panel .a {
      color: #5a4a30;
      font-size: 16px
    }

    #info-panel .y {
      color: #8a7a6a;
      font-size: 14px
    }

    #wing-label {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 252, 245, .9);
      border: 1px solid #aa9060;
      padding: 6px 16px;
      color: #6a5a30;
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(7px, 1.5vw, 9px);
      z-index: 50;
      opacity: 0;
      transition: opacity .4s;
      pointer-events: none;
      border-radius: 3px;
      letter-spacing: 1px
    }

    #wing-label.visible {
      opacity: 1
    }

    #vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
      display: none;
      background: radial-gradient(ellipse at center, transparent 70%, rgba(0, 0, 0, .12) 100%)
    }

    #touch-ui {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 60;
      pointer-events: none
    }

    #joy-area {
      position: absolute;
      left: 16px;
      bottom: 16px;
      width: 140px;
      height: 140px;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      z-index: 2
    }

    #joy-bg {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(100, 80, 50, .15);
      border: 2px solid rgba(100, 80, 50, .3)
    }

    #joy-knob {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(100, 80, 50, .3);
      border: 2px solid rgba(100, 80, 50, .5);
      top: 42px;
      left: 42px
    }

    #look-area {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      z-index: 1
    }

    #minimap {
      position: fixed;
      top: 8px;
      right: 8px;
      width: 70px;
      height: 70px;
      background: rgba(245, 240, 232, .92);
      border: 1px solid #aa9060;
      z-index: 50;
      display: none;
      border-radius: 3px;
      pointer-events: none
    }

    @media(min-width:768px) {
      #minimap {
        width: 80px;
        height: 80px
      }

      #info-panel {
        bottom: 30px
      }
    }

    /* Mobile portrait optimizations */
    @media(max-width:767px) {
      #info-panel {
        bottom: auto;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 92vw;
        padding: 8px 14px;
        font-size: 16px;
        z-index: 70
      }

      #info-panel .t {
        font-size: clamp(7px, 2.5vw, 10px)
      }

      #info-panel .a {
        font-size: 14px
      }

      #info-panel .y {
        font-size: 13px
      }

      #wing-label {
        top: 6px;
        padding: 5px 12px;
        font-size: clamp(6px, 2vw, 9px);
        z-index: 65
      }

      #minimap {
        width: 60px;
        height: 60px;
        top: 6px;
        right: 6px;
        z-index: 65
      }

      #fs-btn {
        top: auto;
        bottom: 20px;
        left: auto;
        right: 10px;
        transform: none;
        font-size: 9px;
        padding: 7px 10px;
        opacity: 0.7
      }

      #mute-btn {
        top: 10px;
        right: 81px;
        left: auto;
        font-size: 16px;
        padding: 8px;
        opacity: 0.7;
      }

      #art-close {
        top: 10px;
        right: 10px;
        width: 48px;
        height: 48px;
        font-size: 40px;
        line-height: 42px
      }

      #mute-btn {
        top: 10px;
        right: 10px;
        padding: 8px;
        font-size: 14px;
      }

      #art-canvas-container {
        width: 95%;
        max-height: 70vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch
      }

      #art-title {
        font-size: clamp(8px, 3vw, 14px);
        margin-top: 12px;
        padding: 0 10px
      }

      #art-desc {
        font-size: clamp(14px, 3.5vw, 20px);
        padding: 0 10px
      }

      #art-desc p {
        font-size: clamp(13px, 3vw, 18px)
      }

      #sketchfab-viewer {
        height: 40vh;
        min-height: 220px
      }

      #art-viewer.show.sculpture-mode {
        padding-bottom: 30px
      }

      .controls-info {
        font-size: clamp(12px, 3vw, 16px);
        padding: 0 16px
      }
    }

    /* Mobile landscape optimizations */
    @media(max-height:500px) and (orientation:landscape) {
      #joy-area {
        left: 10px;
        bottom: 10px;
        width: 100px;
        height: 100px
      }

      #joy-bg {
        width: 100px;
        height: 100px
      }

      #joy-knob {
        width: 42px;
        height: 42px;
        top: 29px;
        left: 29px
      }

      #info-panel {
        bottom: auto;
        top: 6px;
        max-width: 50vw;
        padding: 6px 12px;
        font-size: 14px;
        z-index: 70
      }

      #wing-label {
        display: none
      }

      #minimap {
        width: 50px;
        height: 50px;
        top: 4px;
        right: 4px;
        z-index: 65
      }

      #art-canvas-container {
        width: 60%;
        max-height: 85vh
      }

      #art-close {
        top: 8px;
        right: 8px
      }

      #sketchfab-viewer {
        height: 70vh;
        min-height: 180px
      }
    }

    /* Safe area support for notched phones */
    @supports(padding: env(safe-area-inset-bottom)) {
      #joy-area {
        bottom: calc(16px + env(safe-area-inset-bottom));
        left: calc(16px + env(safe-area-inset-left))
      }

      #minimap {
        top: calc(8px + env(safe-area-inset-top));
        right: calc(8px + env(safe-area-inset-right))
      }

      #wing-label {
        top: calc(8px + env(safe-area-inset-top))
      }

      #art-close {
        top: calc(15px + env(safe-area-inset-top));
        right: calc(25px + env(safe-area-inset-right))
      }
    }

    @supports(padding: env(safe-area-inset-bottom)) {
      @media(max-width:767px) {
        #fs-btn {
          bottom: calc(20px + env(safe-area-inset-bottom));
          right: calc(10px + env(safe-area-inset-right))
        }

        #mute-btn {
          top: calc(10px + env(safe-area-inset-top));
          right: calc(10px + env(safe-area-inset-right))
        }
      }

      @media(min-width:768px) {
        #fs-btn {
          top: calc(10px + env(safe-area-inset-top));
          left: calc(10px + env(safe-area-inset-left))
        }

        #mute-btn {
          top: calc(10px + env(safe-area-inset-top));
          right: calc(81px + env(safe-area-inset-right))
        }
      }
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 45;
      display: none
    }

    #crosshair.active {
      border-color: #ffcc00;
      box-shadow: 0 0 8px #ffcc00
    }

    #art-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 5, 0, 0.92);
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none
    }

    #art-viewer.show {
      opacity: 1;
      pointer-events: auto;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    #art-viewer.show.sculpture-mode {
      background: linear-gradient(to top, rgba(10, 5, 0, 0.9) 0%, rgba(10, 5, 0, 0) 40%);
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      justify-content: flex-end;
      padding-bottom: 50px;
    }

    #art-canvas-container {
      position: relative;
      width: 90%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center
    }

    /* Céges kép / videó nagy nézete — a festmény-vászonnal azonos keretezéssel */
    #art-media-img, #art-video {
      display: none;
      max-width: 100%;
      max-height: 62vh;
      border-radius: 3px;
      object-fit: contain;
      background: #0d0b07;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 0 6px #886622, 0 0 0 10px #1a1005;
      transform: scale(0.9);
      transition: transform 0.5s;
    }
    #art-viewer.show #art-media-img, #art-viewer.show #art-video { transform: scale(1); }

    #art-canvas-zoom {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 0 6px #886622, 0 0 0 10px #1a1005;
      max-width: 100%;
      border-radius: 3px;
      transform: scale(0.9);
      transition: transform 0.5s;
      object-fit: contain;
      background: #fff;
    }

    #sketchfab-viewer {
      width: 100%;
      height: 50vh;
      min-height: 300px;
      max-height: 600px;
      border: 0;
      border-radius: 6px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 0 4px #444;
      display: none;
      transform: scale(0.9);
      transition: transform 0.5s;
    }

    #art-viewer.show #art-canvas-zoom,
    #art-viewer.show #sketchfab-viewer {
      transform: scale(1)
    }

    #art-title {
      color: #f0e6d3;
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(10px, 2vw, 18px);
      margin-top: 20px;
      text-align: center;
      text-shadow: 2px 2px 0 #000;
      line-height: 1.5
    }

    #art-desc {
      color: #aa9060;
      font-family: 'VT323', monospace;
      font-size: clamp(16px, 3vw, 24px);
      margin-top: 10px;
      text-align: center
    }

    #art-desc p {
      max-width: 600px;
      margin-top: 10px;
      color: #c0b0a0;
      font-size: clamp(14px, 2.5vw, 20px);
      line-height: 1.4
    }

    #art-close {
      position: absolute;
      top: 15px;
      right: 25px;
      color: #c8a87a;
      font-family: 'VT323', monospace;
      font-size: 35px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      line-height: 35px;
      text-align: center;
      background: rgba(20, 15, 10, 0.8);
      border-radius: 50%;
      border: 2px solid #a88833;
      transition: all 0.2s
    }

    #art-close:hover {
      background: #c8a87a;
      color: #111;
      transform: scale(1.1)
    }
    #lang-switch { position: fixed; top: 46px; left: 12px; z-index: 110; display: flex; gap: 4px; }
    #lang-switch .lang-btn {
      font-family: 'VT323', monospace; font-size: 16px; line-height: 1; color: #ddd;
      background: rgba(0,0,0,0.55); border: 1px solid #6a5a48; border-radius: 4px;
      padding: 3px 9px; cursor: pointer; user-select: none; letter-spacing: 1px;
    }
    #lang-switch .lang-btn.active { background: #b4541f; color: #fff; border-color: #b4541f; }
    #model-loading {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #ffe; font-family: 'VT323', monospace;
      font-size: 20px; padding: 6px 16px; border-radius: 6px; letter-spacing: 1px;
      z-index: 50; display: none; pointer-events: none;
    }
    #sit-hint {
      position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.72); color: #ffe; font-family: 'VT323', monospace;
      font-size: 20px; padding: 6px 16px; border-radius: 6px; letter-spacing: 1px;
      z-index: 70; display: none; pointer-events: none; text-align: center;
    }
  </style>
</head>

    // ── LIFT (arany felvonó a hub ÉK-i sarkában, 3 megállóval) ──
    function makeLabelTex(txt, wide) {
      var c = document.createElement('canvas'); c.width = wide ? 128 : 64; c.height = 64;
      var x = c.getContext('2d');
      x.fillStyle = '#241c10'; x.fillRect(0, 0, c.width, 64);
      x.fillStyle = '#ffd44a'; x.font = 'bold ' + (wide ? 36 : 40) + 'px monospace';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(txt, c.width / 2, 35);
      var t2 = new THREE.CanvasTexture(c); t2.magFilter = THREE.NearestFilter; return t2;
    }
    function buildLift() {
      var LX = lift.x, LZ = lift.z, TOP = FLOORS[2] + 5.3;

      function shBox(w, h, d, x, y, z) { var g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z); sg.push(g); }
      shBox(0.15, TOP, 3.4, LX + 1.7, TOP / 2, LZ);
      shBox(3.4, TOP, 0.15, LX, TOP / 2, LZ - 1.7);
      shBox(3.4, TOP, 0.15, LX, TOP / 2, LZ + 1.7);
      shBox(0.15, TOP, 1.0, LX - 1.7, TOP / 2, LZ - 1.2);
      shBox(0.15, TOP, 1.0, LX - 1.7, TOP / 2, LZ + 1.2);
      for (var f = 0; f < FLOORS.length; f++) {
        var y0 = FLOORS[f] + 2.6, y1 = (f < FLOORS.length - 1 ? FLOORS[f + 1] : TOP);
        shBox(0.15, y1 - y0, 1.4, LX - 1.7, (y0 + y1) / 2, LZ);
      }
      scene.add(new THREE.Mesh(mergeGeoms(sg), shellMat)); for (var gi = 0; gi < sg.length; gi++) sg[gi].dispose();

      // Arany ajtókeretek + küszöblemezek (a födém-kivágás és a kabin közti rést takarják)
      var gg = [];
      function gBox(w, h, d, x, y, z) { var g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z); gg.push(g); }
      for (var f = 0; f < FLOORS.length; f++) {
        gBox(0.12, 2.75, 0.12, LX - 1.72, FLOORS[f] + 1.375, LZ - 0.76);

        gBox(0.12, 0.12, 1.64, LX - 1.72, FLOORS[f] + 2.69, LZ);
        gBox(0.5, 0.08, 1.55, LX - 1.45, FLOORS[f] - 0.04, LZ);
      }
      scene.add(new THREE.Mesh(mergeGeoms(gg), goldMat)); for (var gi = 0; gi < gg.length; gi++) gg[gi].dispose();

      // Szintenkénti (állomás-) ajtópanelek — a kabin érkezésekor csúsznak szét

        var L = new THREE.Mesh(new THREE.BoxGeometry(0.07, 2.55, 0.72), doorMat);
        var R = new THREE.Mesh(new THREE.BoxGeometry(0.07, 2.55, 0.72), doorMat);

        lift.doors.push({ L: L, R: R, f: f });
        liftClickables.push(L, R); // az ajtóra kattintás ne "essen át" mögöttes műtárgyra
        // Jelzőlámpák (F/1/2) az ajtó fölött
        var set = [];
        for (var k = 0; k < 3; k++) {
          var lm = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.09, 0.09), new THREE.MeshBasicMaterial({ color: 0x40361f }));
          lm.position.set(LX - 1.81, FLOORS[f] + 2.95, LZ - 0.18 + k * 0.18);
          scene.add(lm); set.push(lm.material);
        }
        lift.lamps.push(set);
        // Hívógomb a keret mellett
        var cb = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.14, 0.14), new THREE.MeshBasicMaterial({ color: 0xffd44a }));
        cb.position.set(LX - 1.80, FLOORS[f] + 1.45, LZ + 0.95);

      }

      // "LIFT" tábla a földszinti ajtó fölött
      var pl = new THREE.Mesh(new THREE.PlaneGeometry(0.85, 0.28), new THREE.MeshBasicMaterial({ map: makeLabelTex('LIFT', true) }));
      pl.position.set(LX - 1.79, 3.35, LZ); pl.rotation.y = -Math.PI / 2; scene.add(pl);

      // Kabin: padló + tető + hátfal + oldalfalak (elöl nyitott — az állomás-ajtók zárnak)
      var cab = new THREE.Group();
      var cs = [];

      for (var gi = 0; gi < cs.length; gi++) cs[gi].dispose();
      // bordó bársony hátfal-betét + arany kapaszkodó + meleg mennyezeti fénypanel

      var lightPanel = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.03, 1.6), new THREE.MeshBasicMaterial({ color: 0xfff2dc }));
      lightPanel.position.set(0, 2.69, 0); cab.add(lightPanel);

        var b = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.13, 0.03), new THREE.MeshBasicMaterial({ map: makeLabelTex(String(f)) }));
        b.position.set(-0.85, 1.15 + f * 0.24, -1.13);
        b.userData.liftGo = f;
        cab.add(b);
      }
      cab.position.set(LX, 0, LZ);
      scene.add(cab);
      lift.cab = cab;
      liftClickables.push(cab);
    }

    function playerInLiftCab() {
      return Math.abs(camera.position.x - lift.x) < 1.15 && Math.abs(camera.position.z - lift.z) < 1.15
        && Math.abs(camera.position.y - 2.5 - lift.y) < 2;
    }
    function callLift(f) {
      if (lift.state !== 'open' || lift.atFloor === f) return;
      lift.target = f; lift.state = 'closing';
    }
    function goLift(f) {
      if (lift.state !== 'open' || f === lift.atFloor) return;
      if (!playerInLiftCab()) { callLift(f); return; }
      lift.target = f; lift.state = 'closing';
    }
    function updateLift(dt) {
      if (!lift.cab) return;
      var DOOR_T = 0.7, SPEED = 3.5;
      if (lift.state === 'closing') {
        lift.doorT -= dt / DOOR_T;
        if (lift.doorT <= 0) {
          lift.doorT = 0;
          lift.riding = playerInLiftCab(); // aki bent áll, az utazik
          lift.state = 'moving';
        }
      } else if (lift.state === 'moving') {
        var ty = FLOORS[lift.target], dy = ty - lift.y, step = SPEED * dt;
        if (Math.abs(dy) <= step) {
          lift.y = ty; lift.atFloor = lift.target; lift.state = 'opening'; playDing();
        } else lift.y += (dy > 0 ? step : -step);
        lift.cab.position.y = lift.y;
        if (lift.riding) {
          camera.position.y = lift.y + 2.5;
          camera.position.x = Math.max(lift.x - 1.0, Math.min(lift.x + 1.0, camera.position.x));
          camera.position.z = Math.max(lift.z - 1.0, Math.min(lift.z + 1.0, camera.position.z));
        }
      } else if (lift.state === 'opening') {
        lift.doorT += dt / DOOR_T;
        if (lift.doorT >= 1) { lift.doorT = 1; lift.state = 'open'; lift.riding = false; }
      }
      // Ajtópanelek + jelzőlámpák frissítése
      var li = 0, bd = 1e9;
      for (var k = 0; k < FLOORS.length; k++) { var d2 = Math.abs(FLOORS[k] - lift.y); if (d2 < bd) { bd = d2; li = k; } }
      for (var i = 0; i < lift.doors.length; i++) {
        var d = lift.doors[i];
        var tt = (d.f === lift.atFloor) ? lift.doorT : 0;
        d.L.position.z = lift.z - (0.36 + tt * 0.74);
        d.R.position.z = lift.z + (0.36 + tt * 0.74);
        var lamps = lift.lamps[i];
        for (var k = 0; k < lamps.length; k++) lamps[k].color.setHex(k === li ? 0xffd44a : 0x40361f);
      }
    }

    var pendingModels = [];   // lazy-betöltendő GLB modellek (közelség alapján)
    var modelsLoading = 0;    // hány modell tölt épp
    var LAZY_DIST = 18;       // ennyi egységen belül kezdjük a betöltést
    function updateModelLoadingBadge() {
      var el = document.getElementById('model-loading');
      if (el) el.style.display = modelsLoading > 0 ? 'block' : 'none';
    }
    function loadPendingModel(rec) {
      rec.loading = true;
      modelsLoading++; updateModelLoadingBadge();
      gltfLoader.load(rec.url, function (gltf) {
        var model = gltf.scene;
        var box = new THREE.Box3().setFromObject(model);
        var size = box.getSize(new THREE.Vector3()).length();
        var scale = 1.8 / (size === 0 ? 1 : size);
        model.scale.setScalar(scale);
        box.setFromObject(model);
        var center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);
        model.position.y += 0.5;
        if (rec.holo && rec.holo.parent) { rec.holo.parent.remove(rec.holo); if (rec.holo.geometry) rec.holo.geometry.dispose(); } // holo-placeholder eltávolítása + GPU-geometria felszabadítása
        rec.group.add(model);
        rec.loaded = true; modelsLoading--; updateModelLoadingBadge();
      }, undefined, function (err) {
        // 404/CORS/sérült: a holo-placeholder látható fallbackként marad
        console.warn('GLB betöltése sikertelen:', rec.url, err);
        rec.loaded = true; modelsLoading--; updateModelLoadingBadge();
      });
    }
    function updateLazyModels() {
      if (!pendingModels.length || typeof camera === 'undefined' || !camera) return;
      for (var i = 0; i < pendingModels.length; i++) {
        var rec = pendingModels[i];
        if (rec.loaded || rec.loading) continue;
        if (camera.position.distanceTo(rec.group.position) < LAZY_DIST) loadPendingModel(rec);
      }
    }
    // ══════════════════════════════════════
    //  CÉGES MÉDIA (Supabase) — kép / videó falikeretek
    // ══════════════════════════════════════
    //  A Supabase Storage stabil, CORS-os URL-t ad; a nyers Google Drive
    //  linkről a böngésző NEM tudná betölteni (nincs rajta CORS-fejléc).
    var mediaItems = [];                       // a betöltött kép/videó tárgyak
    // A sor kulcsa a PADLÓ VILÁG-Y értéke (0 / 14 / 21) — a helykiosztás is ezzel dolgozik,
    // nem az emelet sorszámával. (Az adatbázisban 0/1/2 szerepel, azt itt váltjuk át.)
    var mediaQueue = { 0: [], 14: [], 21: [] };
    var videoScreens = [];                     // a teremben futó videók (közelség alapján indulnak)

    // A feltöltött média ELSŐBBSÉGET élvez a demó festményekkel szemben:
    // sorban elveszi a falhelyeket azon a szinten, ahová szánták.
    function takeMediaFor(fy) {
      var q = mediaQueue[fy];
      return (q && q.length) ? q.shift() : null;
    }

    // A keret a média VALÓDI képarányához igazodik: a tartalom egy megengedett
    // maximális dobozba illeszkedik, arány tartásával. Így se torzítás, se levágás
    // nincs — céges fotón/videón a szélső felirat sem sérül.
    var MEDIA_MAXW = 3.6, MEDIA_MAXH = 2.4;
    function fitBox(aspect) {
      if (!isFinite(aspect) || aspect <= 0) aspect = 16 / 9;
      var w = MEDIA_MAXW, h = MEDIA_MAXW / aspect;
      if (h > MEDIA_MAXH) { h = MEDIA_MAXH; w = MEDIA_MAXH * aspect; }
      return { w: w, h: h };
    }

    // Nyelvfüggő cím/leírás: a dinamikus tárgyaknál a saját fordítás nyer,
    // a beépítetteknél marad a régi ARTNAMES-alapú keresés.
    function mTitle(ud) {
      if (ud && ud.t18 && ud.t18[LANG]) return ud.t18[LANG];
      return tName(ud ? ud.name : '');
    }
    function mDesc(ud) {
      if (ud && ud.d18) return ud.d18[LANG] || ud.d18.hu || '';
      return '';
    }

    // Kordon a fal elé (a festményeknél és a médiánál is ugyanaz)
    function addCordonAt(sp, fy, poleGeoms, ropeGeoms) {
      var isVert = (Math.abs(sp.ry) === Math.PI / 2);
      if (isVert) {
        var px = sp.x < 0 ? sp.x + 1.5 : sp.x - 1.5;
        for (var dz = -1.5; dz <= 1.5; dz += 3) {
          poleGeoms.push(new THREE.CylinderGeometry(0.03, 0.03, 0.9, 8).translate(px, 0.45 + fy, sp.z + dz));
          poleGeoms.push(new THREE.SphereGeometry(0.05, 8, 8).translate(px, 0.92 + fy, sp.z + dz));
        }
        ropeGeoms.push(new THREE.CylinderGeometry(0.012, 0.012, 3, 6).rotateX(Math.PI / 2).translate(px, 0.78 + fy, sp.z));
        cordons.push({ minX: px - 0.4, maxX: px + 0.4, minZ: sp.z - 1.7, maxZ: sp.z + 1.7, y: fy });
      } else {
        var pz = sp.z < 0 ? sp.z + 1.5 : sp.z - 1.5;
        for (var dx = -1.5; dx <= 1.5; dx += 3) {
          poleGeoms.push(new THREE.CylinderGeometry(0.03, 0.03, 0.9, 8).translate(sp.x + dx, 0.45 + fy, pz));
          poleGeoms.push(new THREE.SphereGeometry(0.05, 8, 8).translate(sp.x + dx, 0.92 + fy, pz));
        }
        ropeGeoms.push(new THREE.CylinderGeometry(0.012, 0.012, 3, 6).rotateZ(Math.PI / 2).translate(sp.x, 0.78 + fy, pz));
        cordons.push({ minX: sp.x - 1.7, maxX: sp.x + 1.7, minZ: pz - 0.4, maxZ: pz + 0.4, y: fy });
      }
    }

    // Egy céges kép/videó falikeretbe helyezése
    function buildMediaFrame(sp, fy, item, frameMat, innerMat, plaqueMat, poleGeoms, ropeGeoms) {
      var fp = 0.15, iw = 0.04;
      var box = fitBox(16 / 9);            // kiinduló becslés, amíg a valódi méret meg nem jön
      var aW = box.w, aH = box.h;
      var group = new THREE.Group();

      var t = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), frameMat); group.add(t);
      var b = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), frameMat); group.add(b);
      var l = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), frameMat); group.add(l);
      var r = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), frameMat); group.add(r);
      var it = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), innerMat); group.add(it);
      var ib = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), innerMat); group.add(ib);

      // A vászon: amíg tölt, sötét lap áll benne (nem villan fehéret)
      var pt = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.MeshBasicMaterial({ color: 0x14110c })
      );
      pt.position.z = 0.01; group.add(pt);

      function swapGeom(mesh, g) { if (mesh.geometry) mesh.geometry.dispose(); mesh.geometry = g; }

      // A keret újraépítése a tartalom képarányához
      function applyAspect(aspect) {
        var f = fitBox(aspect);
        aW = f.w; aH = f.h;
        swapGeom(t, new THREE.BoxGeometry(aW + fp * 2, fp, 0.08)); t.position.set(0, aH / 2 + fp / 2, 0);
        swapGeom(b, new THREE.BoxGeometry(aW + fp * 2, fp, 0.08)); b.position.set(0, -aH / 2 - fp / 2, 0);
        swapGeom(l, new THREE.BoxGeometry(fp, aH + fp * 2, 0.08)); l.position.set(-aW / 2 - fp / 2, 0, 0);
        swapGeom(r, new THREE.BoxGeometry(fp, aH + fp * 2, 0.08)); r.position.set(aW / 2 + fp / 2, 0, 0);
        swapGeom(it, new THREE.BoxGeometry(aW, iw, 0.09)); it.position.set(0, aH / 2, 0);
        swapGeom(ib, new THREE.BoxGeometry(aW, iw, 0.09)); ib.position.set(0, -aH / 2, 0);
        swapGeom(pt, new THREE.PlaneGeometry(aW, aH));
      }
      applyAspect(16 / 9);

      if (item.kind === 'video') {
        // Némán, ciklusban megy a falon; a hang a nagy nézetben kapcsol be.
        var vd = document.createElement('video');
        vd.crossOrigin = 'anonymous';
        vd.loop = true; vd.muted = true; vd.playsInline = true; vd.preload = 'metadata';
        vd.setAttribute('playsinline', ''); vd.setAttribute('muted', '');
        // A valódi képarány a metaadatokból derül ki — akkor igazítjuk a keretet.
        vd.addEventListener('loadedmetadata', function () {
          if (vd.videoWidth && vd.videoHeight) applyAspect(vd.videoWidth / vd.videoHeight);
        });
        vd.src = item.public_url;
        var vt = new THREE.VideoTexture(vd);
        vt.minFilter = THREE.LinearFilter; vt.magFilter = THREE.LinearFilter;
        pt.material = new THREE.MeshBasicMaterial({ map: vt }); // a videó adja a saját fényét
        videoScreens.push({ el: vd, group: group, started: false });
      } else {
        var tl = new THREE.TextureLoader();
        tl.setCrossOrigin('anonymous');
        tl.load(item.public_url, function (tx) {
          var im = tx.image;
          if (im && im.width && im.height) applyAspect(im.width / im.height);
          tx.needsUpdate = true;
          pt.material = new THREE.MeshStandardMaterial({ map: tx, roughness: 0.85 });
        }, undefined, function () {
          console.warn('Kép betöltése sikertelen:', item.public_url);
        });
      }

      group.position.set(sp.x, 2.6 + fy, sp.z);
      group.rotation.y = sp.ry;
      group.userData = {
        name: item.title, artist: item.artist || '', year: item.year || '', fy: fy,
        isMedia: true, mediaKind: item.kind, mediaUrl: item.public_url,
        sourceLink: item.source_link || '',
        t18: { hu: item.title, en: item.title_en || item.title, it: item.title_it || item.title },
        d18: { hu: item.description || '', en: item.description_en || item.description || '', it: item.description_it || item.description || '' }
      };
      scene.add(group); artMeshes.push(group);

      var plaque = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 0.03), plaqueMat);
      plaque.position.set(sp.x, 1.2 + fy, sp.z); plaque.rotation.y = sp.ry; scene.add(plaque);

      addCordonAt(sp, fy, poleGeoms, ropeGeoms);
    }

    function buildVoxelSculpture(x, z, ry, name, artist, year, stringLayers, hOff) {
      var voxels = stringLayers.map(function (layer) { return layer.map(function (row) { return row.split('').map(function (c) { return c === '1' ? 1 : 0; }); }); });
      var grp = new THREE.Group();
      var mat = new THREE.MeshStandardMaterial({ color: 0xddeeee, roughness: 0.2, metalness: 0.1 });
      var vs = 0.12; // Adjusted voxel size for higher resolution (12 layers = 1.44h)
      // A voxeleket EGYETLEN geometriává olvasztjuk (közös anyag) → 1 draw call szobronként,
      // sok száz külön box helyett. A csoport interaktív marad (a raycast a csoportig fut fel).
      var voxelGeoms = [];
      for (var i = 0; i < voxels.length; i++) {
        for (var j = 0; j < voxels[i].length; j++) {
          var row = voxels[i][j];
          for (var k = 0; k < row.length; k++) {
            if (row[k]) {
              var bg = new THREE.BoxGeometry(vs, vs, vs);
              bg.translate(k * vs - row.length / 2 * vs, (voxels.length - i) * vs, j * vs - voxels[i].length / 2 * vs);
              voxelGeoms.push(bg);
            }
          }
        }
      }
      if (voxelGeoms.length) {
        var voxMesh = new THREE.Mesh(mergeGeoms(voxelGeoms), mat);
        voxMesh.castShadow = true; voxMesh.receiveShadow = true; grp.add(voxMesh);
        for (var vg = 0; vg < voxelGeoms.length; vg++) voxelGeoms[vg].dispose();
      }
      // Pedestal
      var pedMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a });
      var ped = new THREE.Mesh(new THREE.BoxGeometry(1.2, hOff, 1.2), pedMat);
      ped.position.y = -hOff / 2; grp.add(ped);

      grp.position.set(x, hOff, z);
      grp.rotation.y = ry;
      grp.userData = { name: name, artist: artist, year: year, isSculpture: true };

      var plaqueMat = new THREE.MeshStandardMaterial({ color: 0xccaa44, roughness: 0.3, metalness: 0.6 });
      var plaque = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.03), plaqueMat);
      // Position plaque relative to the group so it rotates with the sculpture!
      plaque.position.set(0, -hOff * 0.3, 0.62);
      grp.add(plaque);

      if (!mobile) {
        var sl = new THREE.SpotLight(0xffffff, 2, 10, Math.PI / 6, 0.3, 1);
        sl.position.set(x, 5, z); sl.target = grp; sl.castShadow = false; scene.add(sl); // árnyék kikapcsolva a GPU textúraegység-limit miatt
      }

      scene.add(grp); artMeshes.push(grp);
    }

    // ── PARTICLES ──
    var pts;
    function addDust() {
      var geo = new THREE.BufferGeometry();
      var dustCount = mobile ? 300 : 1500; // mobilon kevesebb por → olcsóbb per-frame frissítés
      var pos = new Float32Array(dustCount * 3);
      for (var i = 0; i < dustCount * 3; i++) pos[i] = (Math.random() - 0.5) * 140;
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      var mat = new THREE.PointsMaterial({ color: 0xffeedd, size: 0.15, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false });
      pts = new THREE.Points(geo, mat);
      pts.position.y = 2.5; scene.add(pts);
    }

    // A Fullscreen API-t pl. az iOS Safari nem támogatja — ne kínáljunk olyan gombot, ami nem csinál semmit.
    var docEl = document.documentElement;
    var fsSupported = !!(docEl.requestFullscreen || docEl.msRequestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullscreen);

    function startMuseum() {
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('vignette').style.display = 'block';
      document.getElementById('crosshair').style.display = 'block';
      document.getElementById('mute-btn').style.display = 'block';
      initAudio();
      document.getElementById('minimap').style.display = 'block';
      if (fsSupported) document.getElementById('fs-btn').style.display = 'block';
    }
    (function () {
      var sb = document.getElementById('startBtn');
      sb.addEventListener('click', startMuseum);
      sb.addEventListener('touchend', function (e) { e.preventDefault(); startMuseum(); });
      sb.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startMuseum(); } });
    })();

    function toggleFullscreen() {
      var elem = document.documentElement;
      if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        if (elem.requestFullscreen) { elem.requestFullscreen(); }
        else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
        else if (elem.mozRequestFullScreen) { elem.mozRequestFullScreen(); }
        else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT); }
      } else {
        if (document.exitFullscreen) { document.exitFullscreen(); }
        else if (document.msExitFullscreen) { document.msExitFullscreen(); }
        else if (document.mozCancelFullScreen) { document.mozCancelFullScreen(); }
        else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
      }
    }
    (function () {
      var fb = document.getElementById('fs-btn');
      fb.addEventListener('click', toggleFullscreen);
      fb.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleFullscreen(); } });
    })();

    var targetArt = null;
    var raycaster = new THREE.Raycaster();
    var pointer = new THREE.Vector2(0, 0);
    // Listener will be attached in setup
    function closeArt() {
      document.getElementById('art-viewer').classList.remove('show');
      document.getElementById('sketchfab-viewer').src = ""; // Állítsuk le a 3D modellt, ha bezárja
      var av = document.getElementById('art-video');
      if (av) { av.pause(); av.removeAttribute('src'); av.load(); } // a videó ne szóljon tovább a háttérben
      currentArt = null;
    }
    (function () {
      var ac = document.getElementById('art-close');
      ac.addEventListener('click', closeArt);
      ac.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); closeArt(); } });
      // a háttérre kattintva is záruljon; Escape billentyűvel is
      document.getElementById('art-viewer').addEventListener('click', function (e) { if (e.target === this) closeArt(); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && document.getElementById('art-viewer').classList.contains('show')) closeArt();
      });
    })();
    // Biztonsági segédfüggvények: az exhibits.json-ből (külső/generált forrás) jövő
    // szövegek innerHTML-be írása előtt escape-elünk, a linkeket pedig https(s)-re szűrjük,
    // hogy ne legyen tárolt DOM-XSS (pl. <img onerror> a szerző mezőben, vagy javascript: link).
    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function safeUrl(u) {
      u = String(u == null ? '' : u);
      // csak http(s), ÉS attribútum-biztosra escape-elve (nehogy az idézőjel kitörjön az href-ből)
      return /^https?:\/\//i.test(u) ? escHtml(u) : '#';
    }
    function openArt(obj) {
      var ud = obj.userData;
      currentArt = obj; // nyelvváltáskor újrarajzoláshoz

      var titleHtml = ud.sourceLink
        ? "<a href='" + safeUrl(ud.sourceLink) + "' target='_blank' rel='noopener' style='color:inherit;text-decoration:underline;'>" + escHtml(mTitle(ud)) + "</a> <br><span style='font-size:0.6em;color:#da0'>" + escHtml(yearLabel(ud.year)) + "</span>"
        : escHtml(mTitle(ud)) + " <br><span style='font-size:0.6em;color:#da0'>" + escHtml(yearLabel(ud.year)) + "</span>";

      document.getElementById('art-title').innerHTML = titleHtml;

      var zc = document.getElementById('art-canvas-zoom');
      activeSculpture = null;

      var viewer = document.getElementById('art-viewer');
      var sfViewer = document.getElementById('sketchfab-viewer');
      var mImg = document.getElementById('art-media-img');
      var mVid = document.getElementById('art-video');
      // minden nyitáskor alaphelyzet: a céges média elemek rejtve, a videó megállítva
      mImg.style.display = 'none';
      mVid.style.display = 'none';
      mVid.pause();

      if (ud.isMedia) {
        // A cég feltöltött képe / videója nagy nézetben (a videó itt már hanggal megy)
        document.getElementById('art-desc').innerHTML =
          (ud.artist ? t('byMaker') + escHtml(ud.artist) : '')
          + (mDesc(ud) ? "<p>" + escHtml(mDesc(ud)) + "</p>" : '');
        zc.style.display = 'none';
        sfViewer.style.display = 'none';
        sfViewer.src = "";
        viewer.classList.remove('sculpture-mode');
        if (ud.mediaKind === 'video') {
          mVid.src = ud.mediaUrl;
          mVid.muted = false;
          mVid.style.display = 'block';
          var vp = mVid.play();
          if (vp && vp.catch) vp.catch(function () { /* az autoplay-tiltás nem hiba: ott a lejátszó gomb */ });
        } else {
          mImg.src = ud.mediaUrl;
          mImg.alt = mTitle(ud);
          mImg.style.display = 'block';
        }
      } else if (ud.glbUrl) {
        document.getElementById('art-desc').innerHTML = t('byMaker') + escHtml(tName(ud.artist)) + "<p>" + t('descGlb') + "</p><p style='font-size:0.7em;color:#aaa'>" + t('dragMouse') + "</p>";
        zc.style.display = 'none';
        sfViewer.style.display = 'none';
        sfViewer.src = "";
        activeSculpture = obj;
        viewer.classList.add('sculpture-mode');
      } else if (ud.sketchfabId) {
        document.getElementById('art-desc').innerHTML = t('byMaker') + escHtml(tName(ud.artist)) + "<br><span style='font-size:0.75em'>" + escHtml(yearLabel(ud.year)) + "</span><p>" + t('descSketchfab') + "</p>";
        zc.style.display = 'none';
        sfViewer.src = "https://sketchfab.com/models/" + ud.sketchfabId + "/embed?autostart=1&ui_theme=dark&ui_infos=0&ui_watermark=0&ui_annotations=0";
        sfViewer.style.display = 'block';
        viewer.classList.add('sculpture-mode'); // Use same transparent style
      } else if (ud.isSculpture) {
        document.getElementById('art-desc').innerHTML = t('byMaker') + escHtml(tName(ud.artist)) + "<p>" + t('descSculpture') + "</p><p style='font-size:0.7em;color:#aaa'>" + t('dragWindow') + "</p>";
        zc.style.display = 'none';
        sfViewer.style.display = 'none';
        sfViewer.src = "";
        activeSculpture = obj;
        viewer.classList.add('sculpture-mode');
      } else {
        document.getElementById('art-desc').innerHTML = t('byPainter') + escHtml(tName(ud.artist)) + "<p>" + t('descPainting') + "</p>";
        zc.style.display = 'block';
        sfViewer.style.display = 'none';
        sfViewer.src = "";
        viewer.classList.remove('sculpture-mode');
        // Find painting data to redraw on big canvas
        var artData = paintings.find(function (p) { return p.name === ud.name; });
        if (artData) {
          var tmp = document.createElement('canvas'); tmp.width = artData.pw; tmp.height = artData.ph;
          artData.paint(tmp.getContext('2d'));
          var maxW = Math.min(window.innerWidth * (mobile ? 0.9 : 0.8), mobile ? 400 : 600);
          var maxH = window.innerHeight * (mobile ? 0.5 : 0.65);
          var sc = Math.floor(Math.min(maxW / artData.pw, maxH / artData.ph));
          if (sc < 1) sc = 1;
          zc.width = artData.pw * sc; zc.height = artData.ph * sc;
          var zx = zc.getContext('2d');
          zx.imageSmoothingEnabled = false;
          zx.fillRect(0, 0, zc.width, zc.height);
          zx.drawImage(tmp, 0, 0, zc.width, zc.height);
        }
      }
      viewer.classList.add('show');
    }

    // ══════════════════════════════════════
    //  TARTALOM BETÖLTÉSE
    // ══════════════════════════════════════
    //  1) Supabase — a cég az admin felületen feltöltött anyaga (kép/videó/3D).
    //  2) assets/exhibits.json — a régi, generált modell-lista (tartalék).
    //  3) beépített demó — ha egyik sem érhető el.
    //  A kulcs szándékosan publikus ("publishable"): az adatokat a Row Level
    //  Security védi, és a múzeum csak a publikált, kész tárgyakat látja.
    var SB_URL = 'https://kdvyewzykodtyqxgnnxa.supabase.co';
    var SB_KEY = 'sb_publishable_GF_VJz-zwX5uLCRR8pQu6Q_gu-_Vebf';

    function applyExhibits(rows) {
      var models = [];
      mediaItems = []; mediaQueue = { 0: [], 14: [], 21: [] };
      for (var i = 0; i < rows.length; i++) {
        var d = rows[i];
        if (!d.public_url) continue;
        if (d.kind === 'model') {
          models.push({
            name: d.title, artist: d.artist || '', year: d.year || '',
            glbUrl: d.public_url, sourceLink: d.source_link || ''
          });
        } else if (d.kind === 'image' || d.kind === 'video') {
          // emelet sorszáma (0/1/2) → padló világ-Y (0/14/21)
          var fl = FLOORS[(d.floor === 1 || d.floor === 2) ? d.floor : 0];
          mediaItems.push(d);
          mediaQueue[fl].push(d);
        }
      }
      if (models.length) sketchfabModels = models;
      console.log('Supabase tartalom: ' + models.length + ' modell, ' + mediaItems.length + ' kép/videó.');
    }

    function loadFromJson() {
      return fetch('assets/exhibits.json')
        .then(function (res) { return res.ok ? res.json() : Promise.reject('nincs exhibits.json'); })
        .then(function (data) {
          if (data && data.length > 0) {
            sketchfabModels = data.map(function (d) {
              return { name: d.title, artist: d.author, year: d.year || '', glbUrl: d.modelUrl, sourceLink: d.sourceLink };
            });
          }
        });
    }

    fetch(SB_URL + '/rest/v1/exhibits'
      + '?select=id,kind,title,title_en,title_it,artist,year,description,description_en,description_it,'
      + 'public_url,source_link,floor,sort_order'
      + '&is_published=eq.true&status=eq.ready&public_url=not.is.null'
      + '&order=floor.asc,sort_order.asc', { headers: { apikey: SB_KEY } })
      .then(function (res) { return res.ok ? res.json() : Promise.reject('Supabase HTTP ' + res.status); })
      .then(function (rows) {
        if (rows && rows.length) { applyExhibits(rows); return; }
        return loadFromJson(); // üres adatbázis → maradjon a régi lista
      })
      .catch(function (e) {
        console.warn('Supabase nem elérhető, tartalék forrás következik.', e);
        return loadFromJson();
      })
      .catch(function (e) { console.log('Beépített demó tartalom marad.', e); })
      .then(function () { setup(); }, function () { setup(); });

    var viewer = document.getElementById('art-viewer');
    function startDrag(e) { if (!activeSculpture) return; viewerDragging = true; vDragX = (e.touches ? e.touches[0].clientX : e.clientX); }
    function onDrag(e) { if (viewerDragging && activeSculpture) { activeSculpture.rotation.y += ((e.touches ? e.touches[0].clientX : e.clientX) - vDragX) * 0.01; vDragX = (e.touches ? e.touches[0].clientX : e.clientX); } }
    function endDrag() { viewerDragging = false; }

    viewer.addEventListener('mousedown', startDrag);
    viewer.addEventListener('mousemove', onDrag);
    viewer.addEventListener('mouseup', endDrag);
    viewer.addEventListener('mouseleave', endDrag);
    viewer.addEventListener('touchstart', startDrag);
    viewer.addEventListener('touchmove', onDrag);
    viewer.addEventListener('touchend', endDrag);

    var rayPointer = new THREE.Vector2();
    function fireRaycast(ev) {
      var pt = pointer; // alapból a középső célkereszt
      if (ev && ev.clientX != null && renderer && renderer.domElement) {
        // ha van kattintás/koppintás esemény, ONNAN lőjünk — így rá lehet kattintani a padra/műtárgyra
        var rect = renderer.domElement.getBoundingClientRect();
        rayPointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
        rayPointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
        pt = rayPointer;
      }
      raycaster.setFromCamera(pt, camera);
      // Lift: a hívógombok / kabin-belső gombok elsőbbséget élveznek a műtárgyakkal szemben
      if (liftClickables.length) {
        var lhits = raycaster.intersectObjects(liftClickables, true);
        if (lhits.length && lhits[0].distance < 5) {
          var lo = lhits[0].object;
          if (lo.userData.liftCall !== undefined) { callLift(lo.userData.liftCall); return; }
          if (lo.userData.liftGo !== undefined) { goLift(lo.userData.liftGo); return; }
          return; // a kabin testére / ajtóra kattintás ne "essen át" mögöttes műtárgyra
        }
      }
      var intersects = raycaster.intersectObjects(artMeshes, true);
      if (intersects.length > 0) {
        if (intersects[0].distance > 12) return; // túl távoli (pl. födémen átnyúló) találat nem kattintható
        var obj = intersects[0].object;
        while (obj.parent && (obj.userData.isBench === undefined && obj.userData.name === undefined)) {
          obj = obj.parent;
          if (obj === scene) break;
        }

        if (obj.userData.isBench) {
          if (isSitting) return;
          var pos = new THREE.Vector3();
          obj.getWorldPosition(pos);
          camera.position.set(pos.x, pos.y + 0.8, pos.z);
          isSitting = true;
          var sh1 = document.getElementById('sit-hint'); if (sh1) { sh1.textContent = t('standUp'); sh1.style.display = 'block'; }
          return;
        }

        if (obj.userData.name) {
          openArt(obj);
        }
      }
    }

    // FONTOS: a renderer/camera csak a setup()-ban jön létre (a fetch().then-ből hívva),
    // ezért a renderer-függő eseménykötéseket a setup() hívja meg ezen a függvényen át —
    // NEM a top-level scriptben, különben "Cannot read properties of undefined (reading 'domElement')".
    function bindRendererEvents() {
    // WebGL context-loss kezelése (gyenge/mobil GPU elengedheti a kontextust) — ne maradjon némán fekete a vászon.
    renderer.domElement.addEventListener('webglcontextlost', function (ev) {
      ev.preventDefault();
      console.warn('WebGL context lost');
      var n = document.getElementById('sit-hint');
      if (n) { n.textContent = t('contextLost'); n.style.display = 'block'; }
    }, false);
    renderer.domElement.addEventListener('click', function (e) {
      if (dragMoved) { dragMoved = false; return; } // néző-húzás vége ne számítson kattintásnak
      fireRaycast(e);
    });

    // Mute button logic
    var muteBtn = document.getElementById('mute-btn');
    if (muteBtn) {
      var toggleMute = function () {
        if (!actx || !pGain || !ambGain) return;
        isMuted = !isMuted;
        if (isMuted) {
          pGain.gain.value = 0;
          ambGain.gain.value = 0;
          muteBtn.innerHTML = '🔇';
        } else {
          pGain.gain.value = 0.15;
          ambGain.gain.value = 0.05;
          muteBtn.innerHTML = '🔊';
        }
      };
      muteBtn.addEventListener('click', toggleMute);
      muteBtn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleMute(); } });
    }
    }
  </script>
