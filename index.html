html,body{overflow:hidden;background:#f5f0e8;font-family:'VT323',monospace;touch-action:none;width:100%;height:100%}
canvas#c{display:block;width:100%;height:100%}

#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-family:'Press Start 2P',cursive;color:#f0e6d3;font-size:clamp(16px,5vw,28px);text-align:center;line-height:1.8;text-shadow:0 0 20px rgba(255,200,100,.5),3px 3px 0 #2a1a0a;margin-bottom:16px;animation:glow 2s ease-in-out infinite alternate}
.subtitle{color:#c8a87a;font-size:clamp(14px,3vw,22px);margin-bottom:24px;letter-spacing:3px;text-align:center}
.start-btn{font-family:'Press Start 2P',cursive;color:#f0e6d3;font-size:clamp(10px,2.5vw,14px);padding:14px 36px;border:3px solid #c8a87a;background:rgba(42,26,10,.8);cursor:pointer;animation:pulse 1.5s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.start-btn:hover,.start-btn:active{background:rgba(200,168,122,.3);box-shadow:0 0 30px rgba(200,168,122,.4)}
.controls-info{color:#8a7a6a;font-size:clamp(13px,2.2vw,18px);margin-top:20px;text-align:center;line-height:1.8}
@keyframes glow{from{text-shadow:0 0 20px rgba(255,200,100,.3),3px 3px 0 #2a1a0a}to{text-shadow:0 0 40px rgba(255,200,100,.7),3px 3px 0 #2a1a0a}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
#info-panel{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(255,252,245,.95);border:2px solid #aa9060;padding:10px 20px;color:#2a2018;font-size:18px;text-align:center;z-index:50;opacity:0;transition:opacity .4s;pointer-events:none;max-width:88vw;box-shadow:0 4px 16px rgba(0,0,0,.12);border-radius:4px}
#info-panel.visible{opacity:1}
#info-panel .t{font-family:'Press Start 2P',cursive;font-size:clamp(7px,1.8vw,10px);color:#8a6a22;margin-bottom:4px;line-height:1.5}
#info-panel .a{color:#5a4a30;font-size:16px}
#info-panel .y{color:#8a7a6a;font-size:14px}
#wing-label{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:rgba(255,252,245,.9);border:1px solid #aa9060;padding:6px 16px;color:#6a5a30;font-family:'Press Start 2P',cursive;font-size:clamp(7px,1.5vw,9px);z-index:50;opacity:0;transition:opacity .4s;pointer-events:none;border-radius:3px;letter-spacing:1px}
#wing-label.visible{opacity:1}
#vignette{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:40;display:none;background:radial-gradient(ellipse at center,transparent 70%,rgba(0,0,0,.12) 100%)}
#touch-ui{display:none;position:fixed;bottom:0;left:0;width:100%;height:100%;z-index:60;pointer-events:none}
#joy-area{position:absolute;left:14px;bottom:14px;width:120px;height:120px;pointer-events:auto;-webkit-tap-highlight-color:transparent}
#joy-bg{width:120px;height:120px;border-radius:50%;background:rgba(100,80,50,.1);border:2px solid rgba(100,80,50,.25)}
#joy-knob{position:absolute;width:50px;height:50px;border-radius:50%;background:rgba(100,80,50,.25);border:2px solid rgba(100,80,50,.4);top:35px;left:35px}
#look-area{position:absolute;right:0;top:0;width:60%;height:100%;pointer-events:auto;-webkit-tap-highlight-color:transparent}
#minimap{position:fixed;top:8px;right:8px;width:70px;height:70px;background:rgba(245,240,232,.92);border:1px solid #aa9060;z-index:50;display:none;border-radius:3px}
@media(min-width:768px){#minimap{width:80px;height:80px}#info-panel{bottom:30px}}
</style>

var scene, camera, renderer, clock;
var mF=false,mB=false,mL=false,mR=false;
var yaw=0, pitch=0;
var artMeshes=[];
var dragging=false,dragX=0,dragY=0;
var jActive=false,jVx=0,jVy=0,jTid=null;

// Layout: Hub center + 3 wings
// Hub: x[-10,10] z[-10,10]
// North wing: x[-10,10] z[-70,-10]
// East wing: x[10,70] z[-10,10]
// West wing: x[-70,-10] z[-10,10]

var HUB = {x1:-10,x2:10,z1:-10,z2:10};
var NORTH = {x1:-10,x2:10,z1:-70,z2:-10};
var EAST = {x1:10,x2:70,z1:-10,z2:10};
var WEST = {x1:-70,x2:-10,z1:-10,z2:10};
var M = 0.8; // wall margin

function inBounds(x,z){
  // Hub - generous bounds
  if(x>=-9.2&&x<=9.2&&z>=-9.2&&z<=9.2) return true;
  // North wing - overlap with hub at z=-10
  if(x>=-9.2&&x<=9.2&&z>=-69.2&&z<=-8) return true;
  // East wing - overlap with hub at x=10
  if(x>=8&&x<=69.2&&z>=-9.2&&z<=9.2) return true;
  // West wing - overlap with hub at x=-10
  if(x>=-69.2&&x<=-8&&z>=-9.2&&z<=9.2) return true;
  return false;
}

function getWing(x,z){
  if(z<-10) return "Északi Szárny · Klasszikusok";
  if(x>10) return "Keleti Szárny · Impresszionisták";
  if(x<-10) return "Nyugati Szárny · Ikonikus Művek";
  return "Központi Csarnok";
}

function setup(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0xf5f0e8);
  scene.fog=new THREE.Fog(0xf5f0e8,30,80);
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,120);
  camera.position.set(0,2.5,5);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.6;
  renderer.domElement.id='c';
  document.body.insertBefore(renderer.domElement,document.body.firstChild);
  clock=new THREE.Clock();
  buildMuseum();
  placeAllArt();
  addLights();
  setupInput();
  addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  loop();
}

function addBox(w,h,d,mat,x,y,z){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);scene.add(m);return m;
}

function addFloor(w,d,x,z,mat){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);
  m.rotation.x=-Math.PI/2;m.position.set(x,0,z);m.receiveShadow=true;scene.add(m);
}

function addCeil(w,d,x,z){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshStandardMaterial({color:0xf0e8d8}));
  m.rotation.x=Math.PI/2;m.position.set(x,5,z);scene.add(m);
}

function buildMuseum(){
  var floorMat=new THREE.MeshStandardMaterial({color:0x8a7a68,roughness:0.7});
  var wallMat=new THREE.MeshStandardMaterial({color:0xe8e0d4,roughness:0.85});
  var baseMat=new THREE.MeshStandardMaterial({color:0x6a5a48});
  var accentMat=new THREE.MeshStandardMaterial({color:0xaa9060,roughness:0.5,metalness:0.2});

  // Floors & Ceilings
  addFloor(20,20,0,0,floorMat);        // Hub
  addFloor(20,60,0,-40,floorMat);       // North
  addFloor(60,20,40,0,floorMat);        // East
  addFloor(60,20,-40,0,floorMat);       // West
  addCeil(20,20,0,0);
  addCeil(20,60,0,-40);
  addCeil(60,20,40,0);
  addCeil(60,20,-40,0);

  // Floor planks (subtle lines) - slightly raised to avoid z-fighting
  var lineMat=new THREE.MeshStandardMaterial({color:0x7a6a58});
  for(var z=-70;z<=10;z+=1.2){
    var m=new THREE.Mesh(new THREE.PlaneGeometry(160,0.03),lineMat);
    m.rotation.x=-Math.PI/2;m.position.set(0,0.005,z);scene.add(m);
  }

  // ── WALLS ──
  // South wall (back of hub)
  addBox(20.3,5,0.3,wallMat,0,2.5,10);

  // North wing: left & right walls, end wall
  addBox(0.3,5,60,wallMat,-10,2.5,-40);
  addBox(0.3,5,60,wallMat,10,2.5,-40);
  addBox(20.3,5,0.3,wallMat,0,2.5,-70);

  // East wing: top & bottom walls, end wall
  addBox(60,5,0.3,wallMat,40,2.5,-10);
  addBox(60,5,0.3,wallMat,40,2.5,10);
  addBox(0.3,5,20.3,wallMat,70,2.5,0);

  // West wing: top & bottom walls, end wall
  addBox(60,5,0.3,wallMat,-40,2.5,-10);
  addBox(60,5,0.3,wallMat,-40,2.5,10);
  addBox(0.3,5,20.3,wallMat,-70,2.5,0);

  // Baseboards - offset from walls to prevent z-fighting
  var baseMat2=new THREE.MeshStandardMaterial({color:0x6a5a48});
  // North wing
  addBox(0.1,0.25,60,baseMat2,-9.7,0.125,-40);
  addBox(0.1,0.25,60,baseMat2,9.7,0.125,-40);
  // East wing
  addBox(60,0.25,0.1,baseMat2,40,0.125,-9.7);
  addBox(60,0.25,0.1,baseMat2,40,0.125,9.7);
  // West wing
  addBox(60,0.25,0.1,baseMat2,-40,0.125,-9.7);
  addBox(60,0.25,0.1,baseMat2,-40,0.125,9.7);
  // Hub south
  addBox(20,0.25,0.1,baseMat2,0,0.125,9.7);

  // Ceiling beams per wing
  for(var z=-65;z<=-15;z+=10){addBox(20,0.12,0.3,new THREE.MeshStandardMaterial({color:0xc8b898}),0,4.93,z);}
  for(var x=15;x<=65;x+=10){addBox(0.3,0.12,20,new THREE.MeshStandardMaterial({color:0xc8b898}),x,4.93,0);}
  for(var x=-65;x<=-15;x+=10){addBox(0.3,0.12,20,new THREE.MeshStandardMaterial({color:0xc8b898}),x,4.93,0);}

  // Hub columns at wing entrances (decorative)
  var colMat=new THREE.MeshStandardMaterial({color:0xd8d0c0,roughness:0.5});
  var colPositions=[[-10,-10],[10,-10],[10,-10],[10,10],[-10,-10],[-10,10]];
  // Simplified: 4 corner columns at hub
  [[-9,2.5,-9],[9,2.5,-9],[9,2.5,9],[-9,2.5,9]].forEach(function(p){
    addBox(0.6,5,0.6,colMat,p[0],p[1],p[2]);
  });

  // Wing entrance arches (decorative accent strips)
  addBox(1,0.2,0.3,accentMat,0,4.6,-10);   // North entrance
  addBox(0.3,0.2,1,accentMat,10,4.6,0);     // East entrance
  addBox(0.3,0.2,1,accentMat,-10,4.6,0);    // West entrance

  // Benches in each wing
  var benchMat=new THREE.MeshStandardMaterial({color:0x7a6a50,roughness:0.6});
  [-30,-50].forEach(function(z){addBox(3,0.12,1,benchMat,0,0.6,z);});
  [30,50].forEach(function(x){addBox(1,0.12,3,benchMat,x,0.6,0);});
  [-30,-50].forEach(function(x){addBox(1,0.12,3,benchMat,x,0.6,0);});
}

function placeAllArt(){
  // Artwork spots per wing
  var spots=[
    // North wing (4): paintings[0-3]
    {x:-9.7,z:-25,ry:Math.PI/2},
    {x:9.7,z:-35,ry:-Math.PI/2},
    {x:-9.7,z:-48,ry:Math.PI/2},
    {x:9.7,z:-60,ry:-Math.PI/2},
    // East wing (4): paintings[4-7]
    {x:22,z:-9.7,ry:Math.PI},
    {x:36,z:9.7,ry:0},
    {x:50,z:-9.7,ry:Math.PI},
    {x:62,z:9.7,ry:0},
    // West wing (4): paintings[8-11]
    {x:-22,z:9.7,ry:0},
    {x:-36,z:-9.7,ry:Math.PI},
    {x:-50,z:9.7,ry:0},
    {x:-62,z:-9.7,ry:Math.PI}
  ];

  var frameMat=new THREE.MeshStandardMaterial({color:0xaa8833,roughness:0.4,metalness:0.5});
  var innerMat=new THREE.MeshStandardMaterial({color:0x886622,roughness:0.5,metalness:0.4});
  var plaqueMat=new THREE.MeshStandardMaterial({color:0xccaa44,roughness:0.3,metalness:0.6});
  var ropeMat=new THREE.MeshStandardMaterial({color:0x8a1111,roughness:0.4,metalness:0.2});
  var poleMat=new THREE.MeshStandardMaterial({color:0xccaa44,roughness:0.3,metalness:0.7});

  for(var i=0;i<paintings.length&&i<spots.length;i++){
    var art=paintings[i],sp=spots[i];

    // Texture
    var tmp=document.createElement('canvas');tmp.width=art.pw;tmp.height=art.ph;
    art.paint(tmp.getContext('2d'));
    var sc=8,cv=document.createElement('canvas');cv.width=art.pw*sc;cv.height=art.ph*sc;
    var cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;cx.drawImage(tmp,0,0,cv.width,cv.height);
    var tex=new THREE.CanvasTexture(cv);tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.NearestFilter;

    var aspect=art.pw/art.ph, aH=2.2, aW=aH*aspect, fp=0.15;
    var group=new THREE.Group();

    // Frame
    var t=new THREE.Mesh(new THREE.BoxGeometry(aW+fp*2,fp,0.08),frameMat);t.position.y=aH/2+fp/2;group.add(t);
    var b=new THREE.Mesh(new THREE.BoxGeometry(aW+fp*2,fp,0.08),frameMat);b.position.y=-aH/2-fp/2;group.add(b);
    var l=new THREE.Mesh(new THREE.BoxGeometry(fp,aH+fp*2,0.08),frameMat);l.position.x=-aW/2-fp/2;group.add(l);
    var r=new THREE.Mesh(new THREE.BoxGeometry(fp,aH+fp*2,0.08),frameMat);r.position.x=aW/2+fp/2;group.add(r);

    // Inner accent
    var iw=0.04;
    var it=new THREE.Mesh(new THREE.BoxGeometry(aW,iw,0.09),innerMat);it.position.y=aH/2;group.add(it);
    var ib=new THREE.Mesh(new THREE.BoxGeometry(aW,iw,0.09),innerMat);ib.position.y=-aH/2;group.add(ib);

    // Painting
    var pt=new THREE.Mesh(new THREE.PlaneGeometry(aW,aH),new THREE.MeshStandardMaterial({map:tex,roughness:0.8}));
    pt.position.z=0.01;group.add(pt);

    group.position.set(sp.x,2.6,sp.z);
    group.rotation.y=sp.ry;
    group.userData={name:art.name,artist:art.artist,year:art.year};
    scene.add(group);
    artMeshes.push(group);

    // Plaque
    var plaque=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.3,0.03),plaqueMat);
    plaque.position.set(sp.x,1.2,sp.z);plaque.rotation.y=sp.ry;scene.add(plaque);

    // Ropes
    var isVert=(Math.abs(sp.ry)===Math.PI/2); // vertical wing (north) vs horizontal
    if(isVert){
      var px=sp.x<0?sp.x+1.5:sp.x-1.5;
      for(var dz=-1.5;dz<=1.5;dz+=3){
        var pole=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.9,8),poleMat);pole.position.set(px,0.45,sp.z+dz);scene.add(pole);
        var ball=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),poleMat);ball.position.set(px,0.92,sp.z+dz);scene.add(ball);
      }
      var rope=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,3,6),ropeMat);rope.rotation.x=Math.PI/2;rope.position.set(px,0.78,sp.z);scene.add(rope);
    } else {
      var pz=sp.z<0?sp.z+1.5:sp.z-1.5;
      for(var dx=-1.5;dx<=1.5;dx+=3){
        var pole=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.9,8),poleMat);pole.position.set(sp.x+dx,0.45,pz);scene.add(pole);
        var ball=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),poleMat);ball.position.set(sp.x+dx,0.92,pz);scene.add(ball);
      }
      var rope=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,3,6),ropeMat);rope.rotation.z=Math.PI/2;rope.position.set(sp.x,0.78,pz);scene.add(rope);
    }
  }
}

function addLights(){
  scene.add(new THREE.AmbientLight(0xfff8f0,0.95));

  // Hub lights
  for(var x=-5;x<=5;x+=10)for(var z=-5;z<=5;z+=10){
    var l=new THREE.PointLight(0xffffff,0.5,15);l.position.set(x,4.8,z);scene.add(l);
  }

  // North wing lights
  for(var z=-15;z>=-65;z-=8){
    var l=new THREE.PointLight(0xffffff,0.5,16);l.position.set(0,4.8,z);scene.add(l);
    var l2=new THREE.PointLight(0xfff8f0,0.2,10);l2.position.set(-5,4.5,z);scene.add(l2);
    var l3=new THREE.PointLight(0xfff8f0,0.2,10);l3.position.set(5,4.5,z);scene.add(l3);
  }

  // East wing lights
  for(var x=15;x<=65;x+=8){
    var l=new THREE.PointLight(0xffffff,0.5,16);l.position.set(x,4.8,0);scene.add(l);
    var l2=new THREE.PointLight(0xfff8f0,0.2,10);l2.position.set(x,4.5,-5);scene.add(l2);
    var l3=new THREE.PointLight(0xfff8f0,0.2,10);l3.position.set(x,4.5,5);scene.add(l3);
  }

  // West wing lights
  for(var x=-15;x>=-65;x-=8){
    var l=new THREE.PointLight(0xffffff,0.5,16);l.position.set(x,4.8,0);scene.add(l);
    var l2=new THREE.PointLight(0xfff8f0,0.2,10);l2.position.set(x,4.5,-5);scene.add(l2);
    var l3=new THREE.PointLight(0xfff8f0,0.2,10);l3.position.set(x,4.5,5);scene.add(l3);
  }

  // Spotlights on artworks
  for(var i=0;i<artMeshes.length;i++){
    var a=artMeshes[i];
    var sl=new THREE.SpotLight(0xffffff,1.8,12,Math.PI/5,0.4,1);
    // Position spotlight in front of painting
    var dir=new THREE.Vector3(0,0,1);
    dir.applyAxisAngle(new THREE.Vector3(0,1,0),a.rotation.y);
    sl.position.set(a.position.x+dir.x*3,4.5,a.position.z+dir.z*3);
    sl.target=a;sl.castShadow=true;scene.add(sl);
  }
}

// ── INPUT ──
function setupInput(){
  document.addEventListener('keydown',function(e){
    if(e.code==='ArrowUp'||e.code==='KeyW')mF=true;
    if(e.code==='ArrowDown'||e.code==='KeyS')mB=true;
    if(e.code==='ArrowLeft'||e.code==='KeyA')mL=true;
    if(e.code==='ArrowRight'||e.code==='KeyD')mR=true;
  });
  document.addEventListener('keyup',function(e){
    if(e.code==='ArrowUp'||e.code==='KeyW')mF=false;
    if(e.code==='ArrowDown'||e.code==='KeyS')mB=false;
    if(e.code==='ArrowLeft'||e.code==='KeyA')mL=false;
    if(e.code==='ArrowRight'||e.code==='KeyD')mR=false;
  });
  if(mobile)setupTouch();else setupMouse();
}

function setupMouse(){
  var cv=renderer.domElement;cv.style.cursor='grab';
  cv.addEventListener('mousedown',function(e){dragging=true;dragX=e.clientX;dragY=e.clientY;cv.style.cursor='grabbing';});
  addEventListener('mousemove',function(e){if(!dragging)return;yaw-=(e.clientX-dragX)*.003;pitch-=(e.clientY-dragY)*.003;pitch=Math.max(-1,Math.min(1,pitch));dragX=e.clientX;dragY=e.clientY;});
  addEventListener('mouseup',function(){dragging=false;renderer.domElement.style.cursor='grab';});
}

function setupTouch(){
  document.getElementById('touch-ui').style.display='block';
  var jZ=document.getElementById('joy-area'),kn=document.getElementById('joy-knob'),lZ=document.getElementById('look-area');
  var jCx=0,jCy=0,lTid=null,lx=0,ly=0;
  function updK(cx,cy){var dx=cx-jCx,dy=cy-jCy,d=Math.sqrt(dx*dx+dy*dy),mx=35;if(d>mx){dx=dx/d*mx;dy=dy/d*mx;}kn.style.left=(35+dx)+'px';kn.style.top=(35+dy)+'px';jVx=dx/mx;jVy=dy/mx;}
  jZ.addEventListener('touchstart',function(e){e.preventDefault();var t=e.changedTouches[0];jTid=t.identifier;jActive=true;var r=jZ.getBoundingClientRect();jCx=r.left+r.width/2;jCy=r.top+r.height/2;updK(t.clientX,t.clientY);},{passive:false});
  jZ.addEventListener('touchmove',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===jTid)updK(e.changedTouches[i].clientX,e.changedTouches[i].clientY);},{passive:false});
  function endJ(e){for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===jTid){jActive=false;jTid=null;jVx=0;jVy=0;kn.style.left='35px';kn.style.top='35px';}}
  jZ.addEventListener('touchend',endJ,{passive:false});jZ.addEventListener('touchcancel',endJ,{passive:false});
  lZ.addEventListener('touchstart',function(e){e.preventDefault();var t=e.changedTouches[0];lTid=t.identifier;lx=t.clientX;ly=t.clientY;},{passive:false});
  lZ.addEventListener('touchmove',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier===lTid){yaw-=(t.clientX-lx)*.005;pitch-=(t.clientY-ly)*.005;pitch=Math.max(-1,Math.min(1,pitch));lx=t.clientX;ly=t.clientY;}}},{passive:false});
  function endL(e){for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===lTid)lTid=null;}
  lZ.addEventListener('touchend',endL,{passive:false});lZ.addEventListener('touchcancel',endL,{passive:false});
}

// ── GAME LOOP ──
function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(clock.getDelta(),0.05),speed=6;
  camera.quaternion.setFromEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));

  var dz=0,dx=0;
  if(mF)dz+=1;if(mB)dz-=1;if(mR)dx+=1;if(mL)dx-=1;
  if(jActive){dx=jVx;dz=-jVy;}

  if(dx!==0||dz!==0){
    var fw=new THREE.Vector3(0,0,-1);fw.applyQuaternion(camera.quaternion);fw.y=0;fw.normalize();
    var st=new THREE.Vector3(1,0,0);st.applyQuaternion(camera.quaternion);st.y=0;st.normalize();
    var nx=camera.position.x+(fw.x*dz+st.x*dx)*speed*dt;
    var nz=camera.position.z+(fw.z*dz+st.z*dx)*speed*dt;
    if(inBounds(nx,nz)){camera.position.x=nx;camera.position.z=nz;}
    else if(inBounds(nx,camera.position.z)){camera.position.x=nx;}
    else if(inBounds(camera.position.x,nz)){camera.position.z=nz;}
  }
  camera.position.y=2.5;

  // Info panel
  var panel=document.getElementById('info-panel');
  var closest=null,closestD=999;
  for(var i=0;i<artMeshes.length;i++){var d=camera.position.distanceTo(artMeshes[i].position);if(d<closestD){closestD=d;closest=artMeshes[i];}}
  if(closest&&closestD<6){panel.classList.add('visible');document.getElementById('iT').textContent=closest.userData.name;document.getElementById('iA').textContent=closest.userData.artist;document.getElementById('iY').textContent=closest.userData.year;}
  else panel.classList.remove('visible');

  // Wing label
  var wl=document.getElementById('wing-label');
  wl.textContent=getWing(camera.position.x,camera.position.z);
  wl.classList.add('visible');

  // Minimap
  var mc=document.getElementById('minimap');
  if(mc.style.display!=='none'){
    var w=mc.clientWidth,h=mc.clientHeight;mc.width=w;mc.height=h;
    var mx=mc.getContext('2d');
    mx.fillStyle='#f0e8d8';mx.fillRect(0,0,w,h);
    var s=w/160,ox=w/2,oy=h/2;
    mx.fillStyle='#e0d8c8';
    // Draw wing shapes
    mx.fillRect(ox-10*s,oy-70*s,20*s,60*s); // North
    mx.fillRect(ox+10*s,oy-10*s,60*s,20*s); // East
    mx.fillRect(ox-70*s,oy-10*s,60*s,20*s); // West
    mx.fillRect(ox-10*s,oy-10*s,20*s,20*s); // Hub
    mx.strokeStyle='#aa9060';mx.lineWidth=1;
    mx.strokeRect(ox-10*s,oy-70*s,20*s,60*s);
    mx.strokeRect(ox+10*s,oy-10*s,60*s,20*s);
    mx.strokeRect(ox-70*s,oy-10*s,60*s,20*s);
    mx.strokeRect(ox-10*s,oy-10*s,20*s,20*s);
    // Paintings
    mx.fillStyle='#cc8822';
    for(var i=0;i<artMeshes.length;i++){mx.fillRect(ox+artMeshes[i].position.x*s-1,oy+artMeshes[i].position.z*s-1,2,2);}
    // Player
    var px=ox+camera.position.x*s,pz=oy+camera.position.z*s;
    mx.fillStyle='#dd3333';mx.beginPath();mx.arc(px,pz,2.5,0,Math.PI*2);mx.fill();
    mx.strokeStyle='#dd5555';mx.lineWidth=1;mx.beginPath();mx.moveTo(px,pz);
    mx.lineTo(px+Math.sin(yaw)*-5,pz+Math.cos(yaw)*-5);mx.stroke();
  }

  renderer.render(scene,camera);
}

function startMuseum(){
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('vignette').style.display='block';
  document.getElementById('minimap').style.display='block';
}
document.getElementById('startBtn').addEventListener('click',startMuseum);
document.getElementById('startBtn').addEventListener('touchend',function(e){e.preventDefault();startMuseum();});
setup();
</script>
</body>
